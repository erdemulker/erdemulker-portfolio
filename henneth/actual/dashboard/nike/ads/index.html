    <title>Henneth · Prototype</title>
    <script>
      // Theme before first paint, so the page never flashes the wrong theme. The choice (system, light, dark) persists in localStorage;
      // data-theme always holds the resolved theme because some Arc parts style dark mode through [data-theme="dark"].
      (function () {
        var choice = 'system';
        try { choice = localStorage.getItem('henneth-theme') || 'system'; } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeChoice = choice;
      })();
    </script>
