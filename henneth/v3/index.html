<title>Henneth Act Loop v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — 240px sidebar + main view (Gandalf thread, Dashboard grid). Arc UI tokens, dark-first. */
:root{
  --bg:#141414; --surface:#191919; --raised:#1f1f1f; --muted-surface:#242424; --hover:color-mix(in srgb,var(--fg) 6%,transparent);
  --fg:#f2f2f2; --fg-2:#b4b4b4; --fg-3:#8c8c8c;
  --border:#2b2b2b; --border-subtle:#222; --border-strong:#484848;
  --accent:#b6cfd9; --accent-strong:#c6e0e9; --on-accent:#141414; --glow-1:color-mix(in srgb,var(--accent) 22%,transparent); --accent-edge:color-mix(in srgb,var(--accent) 30%,transparent); --glow-2:color-mix(in srgb,var(--accent) 44%,transparent);
  --success:#4cd676; --warning:#ffb90e; --danger:#ff736d; --h1:#eef7fa; --h2:#b6cfd9; --h3:#5a8697; --h4:#263d46; --h5:#9fd3e6; --h6:#c9c3ec; --fmix:40%; --holo-wash:.25; --grid:color-mix(in srgb,var(--border) 70%,transparent);
  --g1:color-mix(in srgb,var(--h1) 55%,var(--grid)); --g2:color-mix(in srgb,var(--h2) 55%,var(--grid)); --g3:color-mix(in srgb,var(--h3) 55%,var(--grid)); --g4:color-mix(in srgb,var(--h4) 55%,var(--grid)); --g5:color-mix(in srgb,var(--h5) 55%,var(--grid)); --g6:color-mix(in srgb,var(--h6) 55%,var(--grid));
  --f1:color-mix(in srgb,var(--h1) var(--fmix),var(--accent)); --f2:color-mix(in srgb,var(--h2) var(--fmix),var(--accent)); --f3:color-mix(in srgb,var(--h3) var(--fmix),var(--accent)); --f4:color-mix(in srgb,var(--h4) var(--fmix),var(--accent)); --f5:color-mix(in srgb,var(--h5) var(--fmix),var(--accent)); --f6:color-mix(in srgb,var(--h6) var(--fmix),var(--accent));
  --s1:#55adff; --s2:#b464d8; --s3:#ff8a3d; --s4:#00c07a;
  --shadow-float:0 22px 55px rgba(0,0,0,.34),0 3px 10px rgba(0,0,0,.2);
  --shadow-rest:0 1px 2px rgba(0,0,0,.18);
  --tip-bg:#262626; --tip-fg:#f2f2f2; --tip-fg-2:#b4b4b4; --tip-border:#3a3a3a;
  --font-display:"Mona Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Mona Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Mona Sans",system-ui,-apple-system,"Segoe UI",sans-serif; /* v81: no monospaced text. Mono is for aligned numerals only, see --font-num */
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-control:18px; --r-panel:26px; --r-surface:34px;
  /* motion tokens (see motion-system.md) */
  --t-instant:160ms; --t-fast:300ms; --t-base:440ms; --t-slow:720ms; --t-hero:1600ms;
  --e-standard:cubic-bezier(.2,0,0,1); --e-enter:cubic-bezier(0,0,.2,1); --e-exit:cubic-bezier(.4,0,1,1); --e-spring:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001);
  --stagger:40ms;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#ffffff; --surface:#ffffff; --raised:#ffffff; --muted-surface:#f8f8f8; --hover:color-mix(in srgb,var(--fg) 5%,transparent);
  --fg:#0b0b0b; --fg-2:#585858; --fg-3:#6e6e6e;
  --border:#e9e9e9; --border-subtle:#f3f3f3; --border-strong:#c4c4c4;
  --accent:#4a6974; --accent-strong:#375560; --on-accent:#ffffff; --glow-1:color-mix(in srgb,var(--accent) 12%,transparent); --accent-edge:color-mix(in srgb,var(--accent) 30%,transparent); --glow-2:color-mix(in srgb,var(--accent) 22%,transparent);
  --success:#0a7a24; --warning:#a05500; --danger:#bf1c27; --h1:#375560; --h2:#4a6974; --h3:#9bb8c3; --h4:#e3edf1; --h5:#3f8aa3; --h6:#7470b3; --fmix:26%; --holo-wash:.18; --grid:#e3e3e3;
  --g1:color-mix(in srgb,var(--h1) 55%,var(--grid)); --g2:color-mix(in srgb,var(--h2) 55%,var(--grid)); --g3:color-mix(in srgb,var(--h3) 55%,var(--grid)); --g4:color-mix(in srgb,var(--h4) 55%,var(--grid)); --g5:color-mix(in srgb,var(--h5) 55%,var(--grid)); --g6:color-mix(in srgb,var(--h6) 55%,var(--grid));
  --f1:color-mix(in srgb,var(--h1) var(--fmix),var(--accent)); --f2:color-mix(in srgb,var(--h2) var(--fmix),var(--accent)); --f3:color-mix(in srgb,var(--h3) var(--fmix),var(--accent)); --f4:color-mix(in srgb,var(--h4) var(--fmix),var(--accent)); --f5:color-mix(in srgb,var(--h5) var(--fmix),var(--accent)); --f6:color-mix(in srgb,var(--h6) var(--fmix),var(--accent));
  --s1:#1f7dcf; --s2:#7128a5; --s3:#d97a00; --s4:#009e84;
  --shadow-float:0 20px 48px rgba(0,0,0,.105),0 3px 10px rgba(0,0,0,.045);
  --shadow-rest:0 1px 2px rgba(0,0,0,.035);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#ffffff; --raised:#ffffff; --muted-surface:#f8f8f8; --hover:color-mix(in srgb,var(--fg) 5%,transparent);
  --fg:#0b0b0b; --fg-2:#585858; --fg-3:#6e6e6e;
  --border:#e9e9e9; --border-subtle:#f3f3f3; --border-strong:#c4c4c4;
  --accent:#4a6974; --accent-strong:#375560; --on-accent:#ffffff; --glow-1:color-mix(in srgb,var(--accent) 12%,transparent); --accent-edge:color-mix(in srgb,var(--accent) 30%,transparent); --glow-2:color-mix(in srgb,var(--accent) 22%,transparent);
  --success:#0a7a24; --warning:#a05500; --danger:#bf1c27; --h1:#375560; --h2:#4a6974; --h3:#9bb8c3; --h4:#e3edf1; --h5:#3f8aa3; --h6:#7470b3; --fmix:26%; --holo-wash:.18; --grid:#e3e3e3;
  --g1:color-mix(in srgb,var(--h1) 55%,var(--grid)); --g2:color-mix(in srgb,var(--h2) 55%,var(--grid)); --g3:color-mix(in srgb,var(--h3) 55%,var(--grid)); --g4:color-mix(in srgb,var(--h4) 55%,var(--grid)); --g5:color-mix(in srgb,var(--h5) 55%,var(--grid)); --g6:color-mix(in srgb,var(--h6) 55%,var(--grid));
  --f1:color-mix(in srgb,var(--h1) var(--fmix),var(--accent)); --f2:color-mix(in srgb,var(--h2) var(--fmix),var(--accent)); --f3:color-mix(in srgb,var(--h3) var(--fmix),var(--accent)); --f4:color-mix(in srgb,var(--h4) var(--fmix),var(--accent)); --f5:color-mix(in srgb,var(--h5) var(--fmix),var(--accent)); --f6:color-mix(in srgb,var(--h6) var(--fmix),var(--accent));
  --s1:#1f7dcf; --s2:#7128a5; --s3:#d97a00; --s4:#009e84;
  --shadow-float:0 20px 48px rgba(0,0,0,.105),0 3px 10px rgba(0,0,0,.045);
  --shadow-rest:0 1px 2px rgba(0,0,0,.035);
  color-scheme:light;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 14px/1.4 var(--font-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
/* micro: every pressable element answers hover and press */
.btn,.nav,.chip,.seg button,.iconbtn,.send,.recent,.searchbtn,.pal-item,.hover-acts button,.menu button,.info,.drow{transition:background-color var(--t-fast) var(--e-standard),color var(--t-fast) var(--e-standard),border-color var(--t-fast) var(--e-standard),box-shadow var(--t-fast) var(--e-standard),opacity var(--t-fast) var(--e-standard),transform var(--t-instant) var(--e-standard)}
.btn:active,.chip:active,.seg button:active,.iconbtn:active,.send:active:not([disabled]),.hover-acts button:active,.searchbtn:active{transform:scale(.97)}
.nav:active,.recent:active,.pal-item:active,.menu button:active{transform:scale(.985)}
.send:not([disabled]){transform:scale(1)}
.send[disabled]{transform:scale(.92)}
.btn.primary:active{opacity:.84}
/* state: pressed button briefly confirms */
.btn.done{background:var(--success);color:#fff;border-color:transparent}
.mono{font-family:var(--font-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.side{border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
.ws{display:flex;align-items:center;gap:10px;padding:8px 8px 10px}
.logo{width:28px;height:28px;border-radius:50%;background:var(--muted-surface);border:1px solid var(--border);display:grid;place-items:center;font-weight:600;font-size:12px}
.ws b{font-weight:500;flex:1}
.searchbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:14px;color:var(--fg-3);background:var(--surface);margin-bottom:10px;text-align:left}
.searchbtn .lbl2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font:500 11px var(--font-mono);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--fg-2);background:var(--muted-surface)}
.nav{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:14px;color:var(--fg-2);text-align:left;width:100%;position:relative}
.nav:hover{background:var(--hover);color:var(--fg)}
.nav[aria-current="page"]{background:var(--muted-surface);color:var(--fg);font-weight:500}
.nav .dot{animation:pop var(--t-slow) var(--e-spring)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.nav .dot{margin-left:auto;font:500 11px var(--font-mono);padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.grp{font:500 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:16px 12px 6px}
.recent{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent:hover{background:var(--hover);color:var(--fg)}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:8px}
.me small{display:block;color:var(--fg-3);font-size:12px}
.me .tt{margin-left:auto}
.iconbtn{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;color:var(--fg-2)}
.iconbtn:hover{background:var(--hover);color:var(--fg)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;border-bottom:1px solid var(--border);padding:0 var(--sbw,0px) 0 0}
.view{flex:1;overflow:auto;min-height:0}
.view>*{animation:view-in var(--t-slow) var(--e-enter) both}
@keyframes view-in{from{opacity:0;transform:translateY(6px)}}
.view.leaving>*{animation:view-out var(--t-fast) var(--e-exit) both}
@keyframes view-out{to{opacity:0;transform:translateY(-4px)}}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-control);font-weight:500;white-space:nowrap;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.secondary{background:var(--surface);border-color:var(--border);color:var(--fg)}
.btn.secondary:hover{background:var(--hover);box-shadow:var(--shadow-rest)}
.btn.ghost{color:var(--fg-2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:default}


/* ===== v0.5: Monitor page + floating Gandalf panel. Reuses Arc tokens above. ===== */
[hidden]{display:none!important}
.tag{--c:var(--fg-2);position:relative;display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-mono);padding:2px 8px;border-radius:99px;color:var(--c);isolation:isolate;white-space:nowrap}
.tag::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:.10;z-index:-1}
.tag.ok{--c:var(--success)}.tag.warn{--c:var(--warning)}.tag.bad{--c:var(--danger)}
.tag.dot::after{content:"";order:-1;width:6px;height:6px;border-radius:50%;background:var(--c)}

/* rail: sidebar collapses while the panel pushes the page */
:is(body.rail:not(.sbopen),body.collapsed) .app{grid-template-columns:64px minmax(0,1fr)}
:is(body.rail:not(.sbopen),body.collapsed) .side{padding:12px 11px;align-items:center;overflow:visible}
:is(body.rail:not(.sbopen),body.collapsed) :is(.ws b,.lbl,.lbl2,.kbd,.grp,#recents,.me>div){display:none}
:is(body.rail:not(.sbopen),body.collapsed) :is(.nav,.searchbtn){width:40px;height:40px;padding:0;justify-content:center;gap:0}
:is(body.rail:not(.sbopen),body.collapsed) .ws{padding:4px 0 10px;flex-direction:column;gap:8px}
:is(body.rail:not(.sbopen),body.collapsed) .me{padding:8px 0}
.nav .ic{position:relative;display:grid}
.sdot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);display:none}
.sdot[data-s]{display:block}
.sdot[data-s=run]{background:var(--s1);animation:pulse 1.4s var(--e-standard) infinite}
.sdot[data-s=needs]{background:var(--warning)}
.sdot[data-s=failed]{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.main{transition:padding-right var(--t-base) var(--e-standard)}
body.pn .main{padding-right:424px}
body.pn.overlay .main{padding-right:0}
@media (max-width:1100px){body.pn .main{padding-right:0}}

/* page */
.page{max-width:var(--w-page);margin:0 auto;padding:28px var(--gutter) 140px;display:flex;flex-direction:column;gap:28px}
.ph1{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0}
#runs:empty{display:none}
.ph1 h1{flex:1 1 280px;min-width:0;font:600 30px/1.15 var(--font-display);letter-spacing:-.02em;margin:0}
.psub{margin:-20px 0 0;color:var(--fg-2);max-width:68ch}
.ph-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border:1px solid var(--border);border-radius:99px;background:var(--surface)}
.seg button{height:28px;padding:0 14px;border-radius:99px;color:var(--fg-2);font-weight:500}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--muted-surface);color:var(--fg)}
.gh{display:flex;align-items:center;gap:12px;font:500 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.gh::after{content:"";flex:1;height:1px;background:var(--border);order:1}
.gh .mono{order:2;text-transform:none;letter-spacing:0;font-size:12px}
/* section titles: 28 page gap + 12 = 40 above (space-10), two steps up the Arc scale from 24 */
.page>.gh{margin-top:12px}
.card{border:1px solid var(--border);border-radius:var(--r-panel);background:var(--surface)}

/* in-progress strip */
.runs{display:flex;flex-direction:column;gap:8px}
.runrow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);animation:view-in var(--t-slow) var(--e-enter) both}
.runrow .tx{flex:1;min-width:0}
.runrow b{font-weight:500}
.runrow small{display:block;color:var(--fg-2);font-size:12.5px}
.rdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s1)}
.rdot[data-s=run]{animation:pulse 1.4s infinite}.rdot[data-s=needs]{background:var(--warning)}.rdot[data-s=failed]{background:var(--danger)}.rdot[data-s=done]{background:var(--success)}
.rdot[data-s=meas]{background:transparent;box-shadow:inset 0 0 0 2px var(--s1)}
.rgrp+.rgrp{margin-top:14px}
.rgh{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:500 12px var(--font-body);color:var(--fg-2)}
.rgh .mono{color:var(--fg-3)}
.rmore{margin-top:6px}
.mprog{height:4px;border-radius:2px;background:var(--border);margin-top:8px;overflow:hidden;max-width:320px}
.mprog i{display:block;height:100%;background:var(--accent);transform-origin:left center;transition:transform var(--t-slow) var(--e-standard)}
.runrow .nx{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--fg-2);white-space:nowrap}
.runrow .nx b{font-weight:500;color:var(--fg);font-size:12.5px}

/* signals: one CTA each */
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.sig{padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color var(--t-fast),opacity var(--t-base)}
.sig.on{border-color:var(--border-strong)}
.sig.gone{opacity:.45}
.sig h3{margin:0;font:500 15px/1.3 var(--font-body)}
.sig p{margin:0;color:var(--fg-2);font-size:13px;line-height:1.45}
.sig .btn{align-self:flex-start;margin-top:auto}
.sig .top1{display:flex;align-items:center;gap:8px}

/* KPI + chart */
.kcard{overflow:hidden}
.khead{padding:18px 20px 14px}
.khead h3{margin:0;font:500 15px var(--font-body)}
.khead p{margin:4px 0 0;color:var(--fg-2);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));border-top:1px solid var(--border);overflow-x:auto}
.tab{position:relative;text-align:left;padding:16px 20px 14px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px;color:var(--fg-2);min-width:0}
.tab:last-child{border-right:0}
.tab:hover{background:var(--hover)}
.tab[aria-selected=true]{background:var(--muted-surface);color:var(--fg)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tab:focus-visible{outline-offset:-3px}
.tab .l{font-size:13px}
.tab .v{font:600 28px/1.1 var(--font-display);letter-spacing:-.02em;color:var(--fg)}
.tab .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.tab svg.viz{width:100%;height:44px;margin-top:4px;overflow:visible}
.chart{position:relative;padding:20px;border-top:1px solid var(--border);transition:background-color var(--t-slow) var(--e-standard)}
.chart.edited{background:color-mix(in srgb,var(--s1) 5%,var(--surface))}
.chead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chead h4{margin:0;font:500 15px var(--font-body);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chead p{margin:4px 0 0;color:var(--fg-2);font-size:13px}
.chead .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.lg{display:flex;align-items:center;gap:6px;color:var(--fg-2);font-size:12px;margin-right:6px}
.lg i{width:14px;height:0;border-top:2px solid var(--s1);display:inline-block}
.lg i.p{border-top:2px dashed var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);color:var(--fg);font-weight:500;white-space:nowrap}
.chip:hover{background:var(--hover);border-color:var(--border-strong)}
.chip[aria-pressed=true]{background:var(--muted-surface);border-color:var(--border-strong)}
.edpill{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-mono);padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--s1) 14%,var(--surface));color:var(--fg);animation:pop var(--t-slow) var(--e-spring)}
.edpill svg{color:var(--s1);width:12px;height:12px}
.plot{margin-top:14px;position:relative}
.plot svg{width:100%;height:auto;display:block;overflow:visible}
.plot .ax text{fill:var(--fg-3);font:11px var(--font-body)}
.plot .ax .g{stroke:var(--border)}.plot .ax .b{stroke:var(--border-strong)}
.plot .val{fill:var(--fg-2);font:11px var(--font-mono)}
.plot .hit{fill:transparent}

/* ===== v06 foundations: page template, form, dialog, empty state, motion base ===== */
:root{
  /* layout tokens: every non-chat page uses these */
  --w-page:1240px; --w-narrow:760px; --gutter:40px; --sec-gap:40px; --sub-nav:200px;
  /* type tokens (family Mona Sans; weights 400/500/600/700) */
  --ty-display:600 30px/1.15 var(--font-display);  /* page title */
  --ty-title:600 20px/1.25 var(--font-display);    /* dialog, auth, empty state */
  --ty-head:600 15px/1.3 var(--font-display);      /* card and section heading */
  --ty-body:400 14px/1.45 var(--font-body);
  --ty-small:400 13px/1.45 var(--font-body);
  --ty-cap:500 11px/1.2 var(--font-body);          /* uppercase section label */
  /* colour roles added with Frost */
  --primary-tint:color-mix(in srgb,var(--accent) 12%,transparent);
  --danger-tint:color-mix(in srgb,var(--danger) 10%,transparent);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--accent-strong);
  /* motion recipes (see motion-system.md §v06) */
  --mo-rise:8px;
}
@media (max-width:760px){:root{--gutter:16px;--sec-gap:32px}}

/* ---- motion base: every recipe answers one state sentence ---- */
@keyframes mo-in{from{opacity:0;transform:translateY(var(--mo-rise))}}                       /* something arrived */
@keyframes mo-pop{from{opacity:0;transform:scale(.98) translateY(4px)}}                        /* a layer opened */
@keyframes mo-shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}} /* input rejected */
@keyframes mo-shimmer{to{background-position:-200% 0}}                                         /* loading */
@keyframes mo-draw{to{stroke-dashoffset:0}}                                                    /* success confirmed */
@keyframes mo-pulse{50%{opacity:.45}}                                                          /* syncing */
.mo-in{animation:mo-in var(--t-base) var(--e-enter) both}
.mo-stagger>*{animation:mo-in var(--t-slow) var(--e-enter) both;animation-delay:calc(var(--i,0)*var(--stagger))}
.mo-shake{animation:mo-shake 480ms var(--e-standard)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--muted-surface) 25%,color-mix(in srgb,var(--fg) 8%,var(--muted-surface)) 50%,var(--muted-surface) 75%);background-size:200% 100%;animation:mo-shimmer 1.4s linear infinite;min-height:12px}
.draw{stroke-dasharray:24;stroke-dashoffset:24;animation:mo-draw var(--t-slow) var(--e-enter) 240ms forwards}

/* ---- controls (Arc sizes: sm 36, md 44) ---- */

/* switch */

/* ===== primary action: tonal gradient + edge + highlight (comment on Invite people) =====
   Samples read live on Oct 15: Linear "Sign up" = solid #e5e5e6, 1px same-colour edge, pill, stacked 5-layer soft shadow, no gradient.
   Resend "Get started" = 104deg translucent white gradient (5% to 10%), 2px translucent border, 16 radius, small shadow.
   Both get depth from edge + shadow stack, not from colour change. Henneth: a ~10% tonal gradient (same hue), 1px darker edge,
   1px inner top highlight, soft shadow stack. Text contrast is checked at both gradient ends (dark 9.5+, light 4.7+). */
/* primary v47: between the v20 raised button and the v34 flat one. Half-strength tonal gradient (+8% white top, +6% black bottom),
   1px edge 12% darker, faint inner top highlight, one 1px contact shadow. No drop shadow spread. Text: dark 10.0–11.8:1, light 4.9–6.4:1. */
/* v63 hover: stronger tonal gradient (dark +16% white top / +12% black bottom; light +10% / +14%) and a soft accent glow. The flat overlay is off so the gradient contrast shows. */
/* v65: hover is twice as slow (glow 440 ms, gradient 300 ms). The stronger gradient lives on ::after and fades in, since gradients can't transition. */
/* settings rows: the "Saved" flash sits left of the control, so every control ends at the same right edge */
.srow .ctl{position:relative}
.srow .saved{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap}

.a-card{max-width:none}
.a-demo{margin-top:56px;padding:20px;border:1px solid var(--border);border-radius:16px;background:color-mix(in srgb,var(--fg) 3%,transparent);display:flex;flex-direction:column;gap:6px}
.a-demo h2{margin:0;font:var(--ty-head);color:var(--fg)}

#auth .a-proto{left:auto;right:16px;top:auto;bottom:16px;transform:none}
@media (max-width:900px){.a-foot{align-items:center}}
@media (max-width:600px){#auth .a-proto{right:50%;transform:translateX(50%);top:auto;bottom:12px}#auth .a-l{padding-bottom:64px}}
/* Integration card v51: Unlocks is a titled section right under the description; titled sections sit 24 apart (was 18, off-scale) */
#oCard .oc-body{gap:24px}
.oc-intro{display:flex;flex-direction:column;gap:16px}
/* v59: status is the Unlocks title: neutral ring + "Connect to unlock" / dot + "Unlocked" / accent ring + "Unlocks after setup" / amber dot + "Paused until you reconnect" */
.oc-tl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.oc-f .grow{flex:1}
.oc-st{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--font-body);color:var(--fg-2);white-space:nowrap}
.oc-st i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.oc-st.warn i{background:var(--warning)}.oc-st.pend i{background:none;border:1.5px solid var(--accent)}.oc-st.off i{background:none;border:1.5px solid var(--fg-3)}
.oc-un h4{margin:0 0 6px;font:500 13px/1.3 var(--font-body);color:var(--fg-2)}
.oc-un p{margin:0;font:var(--ty-small);line-height:1.5;color:var(--fg)}
/* v60 slop pass */
.oc-steps li::before{box-shadow:none}
.orow-b .tx b{display:inline}
.orow-b .oc-st{display:flex;margin:4px 0 2px;font-size:12px}
#auth .a-lang{height:auto;width:auto;min-width:0;border:0;background-color:transparent;padding:4px 22px 4px 4px;color:var(--fg-2);font:var(--ty-small);background-position:right 2px center;background-size:14px}
#auth .a-fr .dd-b{min-width:0;height:auto;padding:4px 2px 4px 6px;gap:4px;border-color:transparent;background:transparent;box-shadow:none;color:var(--fg-2);font:var(--ty-small)}
#auth .a-fr .dd-b:hover{color:var(--fg);background:var(--hover)}
#auth .a-fr .dd-ch{width:14px;height:14px}
#auth .a-fr .dd-menu{left:auto;right:0;top:auto;bottom:calc(100% + 6px)}
/* v62: Recommended chip sits under the row CTA, centred to it */
.orow .sd.has-rec{flex-direction:column;align-items:center;gap:6px}
.orow .orow-rec{display:inline-flex;align-items:center;width:max-content;height:20px;margin:0;padding:0 8px;border-radius:6px;font:500 11px/1 var(--font-body);letter-spacing:.01em;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent)}
/* v66: primary actions inside the Integrations side panel are stroke buttons: {accent} 1px edge + {accent} text, no fill.
   Hover: 8% {accent} wash fades in and the primary glow at half strength. */
/* v68 (drop 3 QA): panel list scrollbar stays in the gutter, bottom fade when more rows are below */
.op-list{scrollbar-gutter:stable;scrollbar-color:var(--border-strong) transparent;-webkit-mask-image:linear-gradient(#000 calc(100% - 24px),transparent);mask-image:linear-gradient(#000 calc(100% - 24px),transparent)}
.op-list::-webkit-scrollbar{width:8px}.op-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;border:1px solid transparent;background-clip:padding-box}.op-list::-webkit-scrollbar-track{background:transparent}
/* ===== Focus modality (v43): rings only after keyboard navigation (Tab, arrows on the orbit/tabs).
   Pointer clicks and programmatic focus (autofocus, focus restore) show no ring; inputs only shift to {border-strong}. ===== */
html:not([data-kbd]) :focus,html:not([data-kbd]) :focus-visible{outline:none!important}
/* Active text field (any modality, Arc UI input: focus answers with the border): {accent} border + a very soft accent glow. No ring. */
:is(.in input,.in select,.in textarea,.otp input,.bblock textarea,.bs-f textarea):is(:focus,:focus-visible){outline:none!important;border-color:var(--accent)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent),0 0 14px color-mix(in srgb,var(--accent) 12%,transparent)!important}
:is(.in input,.in select,.in textarea,.otp input,.bblock textarea,.bs-f textarea){transition:border-color var(--t-fast) var(--e-standard),box-shadow var(--t-fast) var(--e-standard)}
html:not([data-kbd]) .sel:is(:focus,:focus-visible){box-shadow:none!important}
html:not([data-kbd]) :is(.sw,.aseg button,.obp-r input,.seg button,.btn,.iconbtn):is(:focus,:focus-visible){box-shadow:none}
html:not([data-kbd]) .btn.secondary:is(:focus,:focus-visible){box-shadow:var(--shadow-rest,none)}

/* =====================================================================
   v69 · Surface system (from Surface v2 trials)
   Buttons: primary = holo stroke · secondary = grey stroke · tertiary = ghost · text = .lnk
   Cards:   plain surface + border, holo corner grid (25% still → 50% turning on hover / open)
   ===================================================================== */
@property --ha{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes holo{to{--ha:360deg}}
:root{--holo:conic-gradient(from var(--ha),var(--h1),var(--h2) 18%,var(--h3) 34%,var(--h4) 50%,var(--h5) 66%,var(--h6) 80%,var(--h1))}

/* Primary: transparent fill, {accent} text, 1px holo ring turning at 6s. Hover: a soft holo wash fades in and starts turning. */
.btn.primary,.send{position:relative;isolation:isolate;background:var(--btn-bg,var(--surface));color:var(--accent);border-color:transparent;box-shadow:none}
.btn.primary::before,.send::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
 background:conic-gradient(from var(--ha),var(--h1),var(--h2) 18%,var(--h3) 34%,var(--h4) 50%,var(--h5) 66%,var(--h6) 80%,var(--h1));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:holo 6s linear infinite}
.btn.primary::after,.send::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;
 background:conic-gradient(from var(--ha) at 100% 0%,var(--f1),var(--f2) 18%,var(--f3) 34%,var(--f4) 50%,var(--f5) 66%,var(--f6) 80%,var(--f1));
 transition:opacity var(--t-base) var(--e-standard);animation:holo 14s linear infinite;animation-play-state:paused}
.btn.primary:not([disabled]):hover,.send:not([disabled]):hover{background:var(--btn-bg,var(--surface));color:var(--accent-strong)}
.btn.primary:not([disabled]):hover::after,.send:not([disabled]):hover::after{opacity:var(--holo-wash);animation-play-state:running}
.btn.primary:active{opacity:1}
.btn.primary[disabled],.send[disabled]{color:var(--fg-3);opacity:1}
.btn.primary[disabled]::before,.send[disabled]::before{background:var(--border-strong);animation:none}
.btn.primary.done{color:var(--success)}
.btn.primary.done::before{background:var(--success);animation:none}
.send{border:0}
.send svg{position:relative}

/* Secondary: grey stroke. Tertiary: ghost (unchanged). Text: .lnk (unchanged). */
.btn.secondary{background:var(--btn-bg,var(--surface));border-color:var(--border-strong);color:var(--fg);box-shadow:none}
.btn.secondary:hover{background:linear-gradient(var(--hover),var(--hover)),var(--btn-bg,var(--surface));box-shadow:none}

/* Cards: holo corner grid. 24px cells anchored top-right, so full cells meet the top and right borders. */
.card,.pc{position:relative;isolation:isolate}
.card::before,.pc::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:.25;
 transition:opacity var(--t-slow) var(--e-standard);
 background:conic-gradient(from var(--ha) at 100% 0%,var(--g1),var(--g2) 18%,var(--g3) 34%,var(--g4) 50%,var(--g5) 66%,var(--g6) 80%,var(--g1));
 -webkit-mask:radial-gradient(320px 300px at 100% 0%,#000 22%,transparent 74%),linear-gradient(transparent calc(100% - 1px),#000 0) right top/24px 24px repeat,linear-gradient(90deg,#000 1px,transparent 1px) right top/24px 24px repeat;
 -webkit-mask-composite:source-in,source-over,source-over;
 mask:radial-gradient(320px 300px at 100% 0%,#000 22%,transparent 74%),linear-gradient(transparent calc(100% - 1px),#000 0) right top/24px 24px repeat,linear-gradient(90deg,#000 1px,transparent 1px) right top/24px 24px repeat;
 mask-composite:intersect,add,add;animation:holo 14s linear infinite;animation-play-state:paused}
.card:hover::before,.pc:hover::before,.card.is-active::before,.pc.is-active::before,.opan.has-card::before{opacity:.5;animation-play-state:running}

@media (prefers-reduced-motion:reduce){
 .btn.primary::before,.send::before,.btn.primary::after,.send::after,.card::before,.pc::before{animation:none}
 .card::before,.pc::before,.btn.primary::after,.send::after{transition:none}}
.dlg,.menu,.pop{--btn-bg:var(--raised)}
/* v71: orbit without glow. The stage is a dark well darker than {bg}, carrying a faint accent tint toward the centre. All blur glows removed. */
:root{--orb-well:#0e1011}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--orb-well:#f3f7f8}}
:root[data-theme=light]{--orb-well:#f3f7f8}
.orb{background:radial-gradient(closest-side,var(--orb-well) 0%,color-mix(in srgb,var(--orb-well) 70%,var(--bg)) 42%,color-mix(in srgb,var(--orb-well) 25%,var(--bg)) 70%,transparent 100%)}
.orb-svg .r1,.orb-svg .lk,.orb-svg .lk.live,.orb-c .hmk circle,.orb-key .k1{filter:none;box-shadow:none}
.orb-c{box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 8%,transparent)}
.oc.live{box-shadow:none}
.oc[aria-pressed=true]{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.oc-d[data-st=syncing]{box-shadow:none}

/* v72: Recommended chip back next to the name, on the name's line, with room above the description */
.orow-b .tx b{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.orow .orow-b .orow-rec{margin:0}
.orow-b .tx b:has(.orow-rec){margin-bottom:4px}
/* =====================================================================
   v75 · Brain workspace. Index (264) + one pane, both inside the screen. No page scroll.
   The pane scrolls inside itself only when a section is long; header and footer stay put.
   ===================================================================== */
.page.bws{gap:20px;padding-bottom:0}
.page.bws .psub{margin-top:-14px}
.bw{display:grid;grid-template-columns:264px minmax(0,1fr);gap:20px;height:clamp(460px,calc(100dvh - 300px),980px);min-height:0}
.bw mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.bw .hue{flex:none;width:8px;height:8px;border-radius:2px;background:var(--h,var(--fg-3))}
.bw .mk{flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--fg-3)}
.bw .mk.on{background:var(--h);border-color:var(--h)}
.bw .mk.req{border-color:var(--warning)}
.bw .mk.new{border:0;background:var(--accent)}

/* Index */
.bw-ix{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto;padding:0 6px 24px 0;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.bw-ix button{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;text-align:left;border-radius:10px;padding:0 10px;color:var(--fg-2);font:500 13.5px/1.3 var(--font-body);transition:background-color var(--t-fast) var(--e-standard),color var(--t-fast) var(--e-standard)}
.bw-ix button:hover{background:var(--hover);color:var(--fg)}
.bw-ix button.cur{background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--fg)}
.bw-ix button.cur .ct{color:var(--fg-2)}
.bw-ix button[disabled]{opacity:.45;cursor:default}
.bw-ix button[disabled]:hover{background:none;color:var(--fg-2)}
.bw-ix .nm{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-ix .ct{flex:none;font:500 11.5px var(--font-mono);color:var(--fg-3);font-variant-numeric:tabular-nums}
.bw-ix .i{flex:none;width:14px;height:14px}
.ix-n{color:var(--fg)!important}
.ix-n.nd-n .ct{color:var(--warning)}
.ix-s.on .mk{background:var(--h);border-color:var(--h)}
.ix-s.req .mk{border-color:var(--warning)}
.ix-l{font:500 12px var(--font-body);color:var(--fg-3);padding:18px 10px 6px}
.ix-cb{color:var(--fg)!important}
.ix-w{flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--warning)}
.ix-c ul{position:relative;list-style:none;margin:2px 0 8px;padding:0 0 0 18px;display:flex;flex-direction:column;gap:1px}
.ix-c ul::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:1px;background:var(--border)}
.ix-c.open ul{animation:ixIn var(--t-base) var(--e-enter)}
@keyframes ixIn{from{opacity:0;transform:translateY(-4px)}}
.ix-s{font-weight:400!important;min-height:32px!important}
.ix-s.req .ct{color:var(--warning);font:500 11.5px var(--font-body)}
.ix-0{color:var(--fg-3);font:var(--ty-small);padding:8px 10px;margin:0}

/* Pane */
.bw-pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:0}
.bw-pane>.bw-cat,.bw-pane>.bw-sec{display:flex;flex-direction:column;flex:1;min-height:0}
.bw-pane.swap>*{animation:bwIn 360ms var(--e-enter)}
@keyframes bwIn{from{opacity:0;transform:translateY(4px)}}
.bw-ph{position:relative;z-index:1;flex:none;display:flex;align-items:flex-start;gap:14px;padding:22px 28px 18px;border-bottom:1px solid var(--border)}
.bw-ph .tx{min-width:0;flex:1}
.bw-ph h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font:600 20px/1.25 var(--font-display);letter-spacing:-.012em;margin:0;outline:none}
.bw-ph p{margin:6px 0 0;color:var(--fg-2);font:var(--ty-small);line-height:1.5;max-width:64ch}
.bw-ph .bt{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--h);background:color-mix(in srgb,var(--h) 12%,transparent);border:1px solid color-mix(in srgb,var(--h) 24%,transparent)}
.bw-ph .bt .i{width:18px;height:18px}
.bw-cm{flex:none;font:500 12px var(--font-mono);color:var(--fg-3);padding-top:5px;white-space:nowrap}
.bw-up{display:inline-flex;align-items:center;gap:8px;margin:0 0 8px -6px;padding:3px 6px;border-radius:6px;font:500 12.5px var(--font-body);color:var(--fg-2);transition:background-color var(--t-fast) var(--e-standard),color var(--t-fast) var(--e-standard)}
.bw-up:hover{color:var(--fg);background:var(--hover)}
.bw-up .i{width:14px;height:14px}
.bw-nav{flex:none;display:flex;align-items:center;gap:2px;margin-top:-2px}
.bw-nav .pos{font:500 12px var(--font-mono);color:var(--fg-3);margin-right:8px;font-variant-numeric:tabular-nums}
.bw-body{flex:1;min-height:0;overflow:auto;padding:20px 28px 28px;scrollbar-width:thin;scrollbar-gutter:stable;scrollbar-color:var(--border-strong) transparent}
.bw-pf{flex:none;display:flex;align-items:center;gap:8px;padding:12px 28px;border-top:1px solid var(--border)}
.bw-pf.ed{display:block;padding:14px 28px 16px}

/* Editor: 3 lines to start, 6 at most, then it scrolls inside */
.bs-f.bw-f textarea{min-height:76px;max-height:168px;resize:none;overflow-y:hidden;line-height:1.5}
.bs-f.bw-f textarea.over{overflow-y:auto;scrollbar-width:thin}
.bs-f textarea,.bblock textarea,.in textarea{max-height:240px}

/* Category overview: every section as a tile */
.bw-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bw-t{display:flex;flex-direction:column;gap:8px;width:100%;height:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:color-mix(in srgb,var(--fg) 3%,transparent);transition:background-color var(--t-fast) var(--e-standard),border-color var(--t-fast) var(--e-standard)}
.bw-t:hover{background:var(--hover);border-color:var(--border-strong)}
.bw-t.miss{background:none;border-style:dashed;border-color:var(--border-strong)}
.bw-t .t-h{display:flex;align-items:center;gap:10px;min-width:0}
.bw-t .t-h b{font:600 14.5px/1.3 var(--font-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-t .t-x{color:var(--fg);font:14px/1.5 var(--font-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bw-t.miss .t-x{color:var(--fg-2)}
.bw-t .t-m{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font:var(--ty-small);color:var(--fg-3)}
.bw-t .t-by{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Section */
.bd-req{font:500 12px var(--font-body);color:var(--warning);letter-spacing:0}
.bd-es{display:flex;flex-direction:column}
.bd-e{position:relative;padding:10px 12px;margin:0 -12px;border-radius:12px;transition:background-color var(--t-fast) var(--e-standard)}
.bd-e:hover,.bd-e:focus-within{background:var(--hover)}
.bd-e.ed:hover,.bd-e.ed:focus-within{background:none}
.bd-e.fresh{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.bd-e .rt{font-size:14.5px;line-height:1.6;color:var(--fg);max-width:66ch}
.bd-e .rt p{margin:0}.bd-e .rt p+p{margin-top:8px}
.bd-e .rt ol,.bd-e .rt ul{margin:0;padding-left:20px}
.bd-em{display:flex;align-items:center;gap:8px;margin-top:4px;min-height:24px}
.bd-em .bd-by{font:var(--ty-small);color:var(--fg-3)}
.bd-ea{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity var(--t-fast) var(--e-standard)}
.bd-e:hover .bd-ea,.bd-e:focus-within .bd-ea{opacity:1}
@media (hover:none){.bd-ea{opacity:1}}
.bd-empty{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border:1px dashed var(--border-strong);border-radius:14px}
.bd-empty p{margin:0;flex:1 1 260px;color:var(--fg-2);font:var(--ty-small);line-height:1.5}
.bd-empty .acts{display:flex;gap:6px}
.bd-nores{padding-top:8px}

/* Search results */
.bw-res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.bw-res button{display:flex;flex-direction:column;gap:4px;width:calc(100% + 28px);text-align:left;padding:12px 14px;margin:0 -14px;border-radius:12px;transition:background-color var(--t-fast) var(--e-standard)}
.bw-res button:hover{background:var(--hover)}
.bw-res .r-c{display:flex;align-items:center;gap:8px;font:var(--ty-small);color:var(--fg-2)}
.bw-res .r-c .i{width:12px;height:12px;color:var(--fg-3)}
.bw-res .r-c b{color:var(--fg);font:500 14px var(--font-body)}
.bw-res .r-x{color:var(--fg-2);font:14px/1.5 var(--font-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Needs you and memory lists */
.bw-list{list-style:none;margin:0;padding:0}
.nd,.mm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.bw-list li:first-child{padding-top:0}
.bw-list li:last-child{border-bottom:0}
.nd .tx,.mm .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.nd b{font-weight:500}
.nd small,.mm small{color:var(--fg-2);font:var(--ty-small);line-height:1.45}
.nd .why{color:var(--fg-3)}
.nd .acts,.mm .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nd-more{margin:16px 0 0;color:var(--fg-3);font:var(--ty-small)}
.mm .hue{align-self:start;margin-top:7px}
.mm p{margin:0;line-height:1.5}
.mm small{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mm small .i{width:12px;height:12px;color:var(--fg-3)}
.mm .mm-m{margin-left:12px;color:var(--fg-3)}

@media (max-width:1100px){.bw{grid-template-columns:220px minmax(0,1fr)}.bw-grid{grid-template-columns:1fr}}
@media (max-width:900px){
 .page.bws{padding-bottom:120px}
 .bw{grid-template-columns:1fr;height:auto;gap:14px}
 .bw-ix{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 0 4px;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
 .bw-ix .ix-l,.bw-ix ul,.bw-ix .ix-0{display:none}
 .bw-ix>div{flex:none}
 .bw-ix button{width:auto;flex:none;white-space:nowrap;border:1px solid var(--border);border-radius:99px;padding:0 12px}

/* =====================================================================
   v81 · Un-slop pass. The rules every screen follows:
   1. A box is earned. Only objects the user acts on or compares get a border: composer, one decision, a chart, dialogs, popovers.
   2. The square pattern (.sq) marks a decision Gandalf is waiting on, and the integrations panel. One per screen. Never on lists, tables or settings.
   3. Status is a word with a small dot, no pill. The normal state is quiet; only exceptions take colour.
   4. Mono is for aligned numerals only (.fig). Never for text. Everything else is the sans with tabular figures where columns need them.
   5. Follow-ups are text rows, not chips. Three at most, and only after an answer.
   6. One lead per screen: the first thing is bigger, the rest recede. No row of equal cards.
   ===================================================================== */

 -webkit-mask-composite:source-in,source-over,source-over;

.tabs{border-top:0;border-bottom:1px solid var(--border)}
.tab{padding:16px 20px 14px}.tab:first-child{padding-left:0}

/* workflows: rows with no tile; time and source stacked on the right */
.wrow{padding:18px 0;grid-template-columns:minmax(0,1fr) auto}

/* integrations: flat list, text action, the one that needs attention keeps a button */

.opan{overflow:hidden}

.op-list{padding:4px 20px 64px}

.lnk.act:hover{background:var(--hover)}
.tag.rec,.orow .orow-rec{--d:var(--accent);--c:var(--accent);height:auto;padding:0;border:0;background:none;border-radius:0;font:500 12.5px var(--font-body);letter-spacing:0}
.tag.rec::after,.orow .orow-rec::after{display:none}
/* brain: the pane is a page, not a box; section icon drops its tile */
.bw-pane.card{border:0;border-radius:0;background:none;border-left:1px solid var(--border);overflow:visible}
.bw-ph{border-bottom:0;padding:4px 0 14px 32px}

.bw-ph .bt,.bm-ic,.bt{width:auto;height:auto;border:0;background:none;border-radius:0}

[data-btab].warn .ct{color:var(--fg-2)}
[data-btab].warn .ct::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warning);margin-right:6px;vertical-align:1px}
/* brain: section overview is a list, not a grid of equal cards */
.bw-grid{display:block}
.bw-grid li{border-top:1px solid var(--border-subtle)}.bw-grid li:first-child{border-top:0}
.bw-t,.bw-t.miss{display:grid;grid-template-columns:190px minmax(0,1fr) 150px;gap:8px 24px;align-items:start;height:auto;padding:16px 8px 16px 0;margin:0;border:0;border-radius:0;background:none}
.bw-t:hover{background:none;border:0}

.bw-t .t-m{margin:0;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.bw-t .t-by{max-width:100%}

.bd-empty{border:0;border-top:1px solid var(--border-subtle);border-radius:0;padding:16px 0}
@media (max-width:760px){.bw-t,.bw-t.miss{grid-template-columns:minmax(0,1fr)}.bw-t .t-m{flex-direction:row;align-items:center;justify-content:space-between}}
/* workflows: tabs already draw the rule */
.wrow:first-child{border-top:0}
#wfl{margin-top:0;border-top:0}
#wfl .empty2,#wfl .empty{border:0}
/* onboarding: one decision boxed, the checklist and guide open */
.ob-ask{padding:24px}
.ob-ask-h{display:block}
.ob-ask-a{padding-left:0}
.card.ob{border:0;background:none;border-radius:0;padding:0}
.ob-l{margin:8px 0 0}
.ob-i{padding:16px 0}
.ob-i.cur,.ob-i.cur+.ob-i{background:none;border-top-color:var(--border-subtle)}
.ob-i:first-child{border-top:1px solid var(--border-subtle)}
.ob-i.cur .ob-s{border-color:var(--accent)}
.ob-i.cur .ob-t b{font-weight:600}
.ob-later{margin:0;padding:14px 0 0;gap:4px 16px;text-transform:none;letter-spacing:0;font:400 13px var(--font-body);color:var(--fg-2)}
.ob-later .lnk.act{padding:4px 0}
.ob-later .lnk.act:hover{background:none;text-decoration:underline;text-underline-offset:4px}
.ob-guide ol{display:block;border-top:1px solid var(--border)}
.ob-guide li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:24px;align-items:baseline;padding:14px 0;border:0;border-bottom:1px solid var(--border-subtle);border-radius:0;background:none}
.ob-guide li::before{content:none}
.ob-guide p{gap:24px}
.ob-guide p>span{display:inline-flex;align-items:center;gap:8px}
.obchip{border:0;background:none;padding:10px 12px;margin:0 0 4px}
.obchip:hover{background:var(--hover);border:0}
/* setup questions: answers are rows, multi-select rows carry a checkbox */
.obq-o{display:flex;flex-direction:column;gap:0;max-width:520px;border-bottom:1px solid var(--border-subtle)}
.obq-o .chip,.obchips .chip{display:flex;align-items:center;gap:12px;height:auto;min-height:46px;padding:0;border:0;border-top:1px solid var(--border-subtle);border-radius:0;background:none;color:var(--fg);font:500 14.5px var(--font-body);text-align:left;position:relative}
.obq-o .chip:hover,.obchips .chip:hover{background:none;border-color:var(--border-subtle);border-top-color:var(--border-subtle)}
.obq-o .chip[data-v],.obq-o .chip[data-other]{justify-content:space-between}
.obq-o .chip[data-v]::after,.obq-o .chip[data-other]::after{content:"→";color:var(--fg-3);transition:transform var(--t-base) var(--e-standard),color var(--t-base) var(--e-standard)}
.obq-o .chip[data-v]:hover::after,.obq-o .chip[data-other]:hover::after{transform:translateX(3px);color:var(--fg)}
.obq-o .chip.ghost{border-style:solid;color:var(--fg-2)}
.obchips{flex-wrap:nowrap}
.obchips .chip::before{content:"";order:-1;flex:none;width:18px;height:18px;box-sizing:border-box;border:1.5px solid var(--edge-control);border-radius:5px}
.obchips .chip[aria-pressed="true"],.obchips .chip[aria-pressed="false"]{background:none;border-color:transparent;border-top-color:var(--border-subtle)}
.obchips .chip[aria-pressed="false"]{color:var(--fg-2)}
.obchips .chip[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.obchips .chip[aria-pressed="true"]::after{content:"";position:absolute;left:6.5px;top:50%;width:5px;height:9px;border:solid var(--on-accent,#0b0b0b);border-width:0 2px 2px 0;transform:translateY(-62%) rotate(45deg)}
.obq-l{border:0;border-top:1px solid var(--border-subtle);border-radius:0;padding:0;margin:0}
/* integration detail: reads and writes as plain stacked lists */
.oc-h{padding:20px 20px 16px}.oc-body{padding:0 20px 8px}
.oc-g{display:block;border:0;border-radius:0;background:none}
.oc-g>div{padding:14px 0;border-top:1px solid var(--border-subtle)}
.oc-g>div+div{border-left:0}
.bw-t,.bw-t.miss{grid-template-columns:230px minmax(0,1fr) 150px}
.bw-t .t-h b{white-space:normal;overflow:visible;text-overflow:clip}
.ob-i.cur{border-radius:0}
.ob-i .lnk.act,.ob-i .tag,.ob-i .btn{min-width:76px;justify-content:center;text-align:center}
.ob-i .lnk.act{padding:6px 0}
.ob-m{min-width:56px;text-align:right}
.lnk.go{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;color:var(--fg);text-decoration:none;font:500 13.5px var(--font-body)}
.lnk.go svg{width:14px;height:14px;transition:transform var(--t-base) var(--e-standard)}
.lnk.go:hover svg{transform:translateX(3px)}
.a-demo{padding:20px 0 0;border:0;border-top:1px solid var(--border);border-radius:0;background:none}
.oc-f{padding:16px 20px}
@media (max-width:900px){.bw-pane.card{border-left:0}.bw-ph{padding-left:0}.bw-pane .bw-body{padding-left:0}}
@media (max-width:760px){.bw-t,.bw-t.miss{grid-template-columns:minmax(0,1fr)}.bw-t .t-m{flex-direction:row;align-items:center;justify-content:space-between;text-align:left}}
/* v83 · numerals in counts are proportional (tabular figures draw slashed zeros that read as mono); tabular stays on .fig */
:is(.ct,.dur,.bw-ix .ct,.bt-l .ct,.tabs2 .ct,.aseg .ct,.mchips .ct,.obchip b){font-variant-numeric:normal;font-feature-settings:normal}
.tab svg.viz path[opacity]{display:none}
.lnk.act.mute{color:var(--fg-2)}
.lnk.act.mute:hover{color:var(--fg)}
/* dashboard: the chosen metric leads, the others recede */
.tab .v{font-size:24px;color:var(--fg-2)}
.tab[aria-selected=true] .v{font-size:34px;color:var(--fg)}
/* v86: the integrations panel pattern is half as strong (.25 to .125 at rest, .5 to .25 with a card open or hovered) */
#oPan::before{opacity:.125}
#oPan.has-card::before,#oPan:hover::before{opacity:.25}
/* v87: filters use the Arc UI segmented control (.aseg, port in js3z.part). Underline tabs (.tabs2) are for contextual views of a page, like Brain. */
.aseg{width:fit-content}
.aseg .ct{font:400 12px var(--font-body)}
.aseg button[aria-pressed=true] .ct{color:var(--fg-2)}
/* v88: a long entry in a Brain section is collapsed to 3.5 lines with a fade out at the bottom and a Show more link (bdClamp in brain4.part) */
.bd-e[data-clp=closed] .rt{max-height:calc(6.4em - 8px);overflow:hidden;-webkit-mask:linear-gradient(#000 1.6em,rgba(0,0,0,.8) 2.9em,rgba(0,0,0,.5) 3.9em,rgba(0,0,0,.2) 4.9em,transparent calc(6.4em - 9px));mask:linear-gradient(#000 1.6em,rgba(0,0,0,.8) 2.9em,rgba(0,0,0,.5) 3.9em,rgba(0,0,0,.2) 4.9em,transparent calc(6.4em - 9px))}
.bd-more{position:absolute;left:0;right:0;top:0;pointer-events:none}
/* v89: Skip for now flies the setup card to the sidebar chip as a 16px soft square (see obSkip in onboard.part) */
.ob-fly{position:fixed;z-index:300;pointer-events:none;overflow:hidden;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);will-change:transform,width,height;contain:layout paint}
.ob-fly .ob-fly-in{position:absolute;left:0;top:0;margin:0;border:0;background:none;box-shadow:none}
.ob-fly .ob-fly-in::before{content:none}
.ob-slot[data-v=hidden]{display:none}
.ob-slot.rise{animation:mo-in var(--t-slow) var(--e-enter) both}
.obl{display:inline-flex;align-items:center;gap:8px;min-width:0}
.obmk{flex:none;width:16px;height:16px;box-sizing:border-box;border-radius:5px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
:is(body.rail:not(.sbopen),body.collapsed) .obchip .obmk{display:none}
@media (prefers-reduced-motion:no-preference){.obmk.land{animation:ob-land 480ms var(--e-standard)}.obchip.land{animation:ob-chip 600ms var(--e-standard)}}
@keyframes ob-land{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
/* v91: Setup is its own page; the sidebar chip is its nav item */
.obchip[aria-current=page]{background:var(--hover)}
.page .card.ob{margin-top:8px}
/* v92: the integrations panel empty state is vertical and centered in the card */
.op-body.vc{display:flex;flex-direction:column;justify-content:center}

/* ---- settings: a section header is its own tier, never a row's first line ---- */

/* ---- Brain entries: text aligns with the section title, actions always visible on the left ---- */
.bd-e{padding:8px;margin:0 -8px;border-radius:0;background:none}
.bd-e:hover,.bd-e:focus-within{background:none}

/* Collapsed entry: progressive blur over the fade (two backdrop layers, stronger toward the cut) */
.bd-e .bd-more::before,.bd-e .bd-more::after{content:'';position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.bd-e .bd-more::before{height:calc(4 * 14.5px + 8px);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);-webkit-mask:linear-gradient(transparent,#000 60%);mask:linear-gradient(transparent,#000 60%)}
.bd-e .bd-more::after{height:calc(2.4 * 14.5px + 8px);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);-webkit-mask:linear-gradient(transparent,#000 70%);mask:linear-gradient(transparent,#000 70%)}
@media (prefers-reduced-transparency:reduce){.bd-e .bd-more::before,.bd-e .bd-more::after{display:none}}

/* Brain doc uses the full column width */
#bDoc .bd-e .rt,#bDoc .bw-ph p{max-width:none}

/* Category header: icon box is one title line tall, so the icon centres on the title */

/* Settings keeps its two-part left nav (Account, Workspace) down to 640px. Narrower content columns stack each row. */

 else if(p.kind==='alert'){await say(a,'Check the rule and save it.');alertForm(a,p.preset)}
 else{await tool(a,'Adding to the weekly summary','Added to the weekly summary',700);receipt(a,{ico:'file',title:p.done.title,rows:p.done.rows,undo:()=>{}})}}
async function notNow(t,g){const a=turn(t,'Not now');await say(a,'Why? I will remember it.');
 chips(a,[['Not a priority'],['Wrong'],['Already done']].map(([l])=>[l,()=>learn(t,g,l)]))}
async function learn(t,g,reason){const a=turn(t,reason);S.sigState[g.key]='dismissed';renderSigs();
 S.undoDismiss[g.key]=()=>{delete S.sigState[g.key];renderSigs()};
 await tool(a,'Updating Brain','Updated Brain',700);
 const el=h(`<div class="pc"><h5>Brain updated</h5><div class="diff"><div class="p">+ Signals like “${esc(g.title)}”: ${esc(reason.toLowerCase())}</div></div><div class="row"><button class="lnk" type="button">Undo</button></div></div>`);
 $('button',el).onclick=()=>{S.undoDismiss[g.key]();el.innerHTML='<p>Undone. The signal is back on the dashboard.</p>'};a.appendChild(el);
 toast('Signal dismissed',[['Undo',()=>{S.undoDismiss[g.key]&&S.undoDismiss[g.key]()}]])}

function runCardEl(plan){return h(`<div class="pc run"><h5>${esc(plan.title)}</h5><div class="steps">${plan.steps.map((s,i)=>`<div class="step" data-s="pend" data-i="${i}"><span class="si"></span><div class="tx">${esc(s.t)}<small></small></div></div>`).join('')}</div></div>`)}
function setStep(run,i,state,sub){const s=$(`.step[data-i="${i}"]`,run.el);s.dataset.s=state;$('.si',s).innerHTML=state==='run'?'<i class="spin"></i>':state==='done'?icon('check'):state==='failed'?icon('x'):state==='skip'?'–':'';if(sub!=null)$('small',s).textContent=sub}
function setStatus(run,s){run.status=s;updateStatus();renderRuns()}
function updateStatus(){const live=S.runs.filter(r=>r.status!=='done'),s=live.some(r=>r.status==='failed')?'failed':live.some(r=>r.status==='needs')?'needs':live.length?'run':null;[$('#sdotNav'),$('#sdotLaunch')].forEach(d=>s?d.dataset.s=s:d.removeAttribute('data-s'));$('#navG').setAttribute('aria-label',s?'Gandalf, '+({run:'working',needs:'needs you',failed:'a run failed'})[s]:'Gandalf');$('#launch').setAttribute('aria-label',s?'Open Gandalf, '+({run:'working',needs:'needs you',failed:'a run failed'})[s]:'Open Gandalf')}
async function runPlan(t,g,p,a){const run={id:++rid,t,g,plan:p,status:'run',i:0,measure:null};run.el=runCardEl(p);a.appendChild(run.el);S.runs.push(run);setStatus(run,'run');
 let handoff=false;for(let i=0;i<p.steps.length&&!handoff;i++){run.i=i;const st=p.steps[i];if(st.approve){if(await approveStep(run,i,st,a)==='handoff')handoff=true}else await autoStep(run,i,st,a)}
 finish(run,a,handoff)}
async function autoStep(run,i,st,a){setStep(run,i,'run','Working…');setStatus(run,'run');await wait(st.ms||1200);
 if(st.k==='draft'&&S.sim==='fail'&&!run.failedOnce){run.failedOnce=true;setStep(run,i,'failed','Stopped. The cached answers expired.');setStatus(run,'failed');notify(run,'A step failed. Nothing was published.');await failCard(run,a);setStep(run,i,'run','Retrying…');setStatus(run,'run');await wait(st.ms||1200)}
 setStep(run,i,'done',((st.ms||1200)/1000).toFixed(1)+'s');
 if(st.k==='research'&&S.sim==='partial'){$(`.step[data-i="${i}"] .tx`,run.el).appendChild(h(`<div class="warnline">${icon('alert')}<span>Grok data is missing for Oct 12. This used 3 of 4 engines.</span></div>`))}}
function failCard(run,a){return new Promise(res=>{const el=h(`<div class="pc"><div class="row">${icon('alert')}<h5>Drafting stopped</h5></div><p>The cached answers I was reading expired. Nothing was published and nothing was sent.</p><div class="log" hidden>12:03:11 read cache perplexity/3 topics\n12:03:12 cache miss: answers older than 24 h\n12:03:12 draft aborted (0 of 3 pages written)</div><div class="row"><button class="btn secondary sm" type="button" data-r>${icon('undo')}Retry step</button><button class="lnk" type="button" data-l>Show log</button></div></div>`);
 $('[data-l]',el).onclick=e=>{const l=$('.log',el);l.hidden=!l.hidden;e.currentTarget.textContent=l.hidden?'Show log':'Hide log'};$('[data-r]',el).onclick=()=>{el.remove();res()};a.appendChild(el)})}
async function approveStep(run,i,st,a){
 if(st.site&&!S.int.wordpress){const r=await blocked(run,i,a);if(r==='handoff')return 'handoff'}
 for(;;){setStep(run,i,'needs','Waiting for you');setStatus(run,'needs');notify(run,'Gandalf needs your approval');
  const ans=await approvalCard(run,st,a);if(ans==='approve')break;setStep(run,i,'needs','Paused');await resumeCard(a)}
 setStep(run,i,'run','Working…');setStatus(run,'run');await wait(1100);setStep(run,i,'done','1.1s')}
function approvalCard(run,st,a){return new Promise(res=>{const el=h(`<div class="pc box sq"><h5>${esc(st.q)}</h5>${st.items?`<ul class="items">${st.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="row"><button class="btn secondary sm" type="button" data-y>Approve</button><button class="lnk" type="button" data-n>Not now</button></div><p class="note">Nothing leaves the product until you approve.</p></div>`);
 $('[data-y]',el).onclick=()=>{$('.row',el).outerHTML='<p>Approved.</p>';res('approve')};$('[data-n]',el).onclick=()=>{$('.row',el).outerHTML='<p>Paused. The drafts are saved.</p>';res('later')};a.appendChild(el)})}
function resumeCard(a){return new Promise(res=>{const el=h(`<div class="pc"><p>The run is paused. Resume when you are ready.</p><div class="row"><button class="btn secondary sm" type="button">${icon('right')}Resume</button></div></div>`);$('button',el).onclick=()=>{el.remove();res()};a.appendChild(el)})}
async function blocked(run,i,a){setStep(run,i,'needs','Checking publish access');setStatus(run,'needs');
 await tool(a,'Checking how nike.com is managed','Checked nike.com',1500);
 return new Promise(res=>{const el=h(`<div class="pc box"><h5>I can’t publish to nike.com yet</h5><p>nike.com runs on <b>WordPress</b> behind <b>Cloudflare</b>. Connect WordPress and I publish the drafts directly, with publish access only.</p><label class="chk"><input type="checkbox"><span>Also connect Cloudflare, so I can clear the cache after publishing</span></label><div class="row"><button class="btn secondary sm" type="button" data-c>${icon('plug')}Connect WordPress</button><button class="lnk" type="button" data-h>I’ll publish the drafts myself</button></div><small>Detected from the site’s headers. Simulated in this prototype.</small></div>`);
 $('[data-c]',el).onclick=async e=>{const b=e.currentTarget,cf=$('input',el).checked;b.disabled=true;$('[data-h]',el).disabled=true;b.innerHTML=`<i class="spin"></i>Waiting for ${cf?'WordPress and Cloudflare':'WordPress'}…`;await wait(1700);S.int.wordpress=true;if(cf)S.int.cloudflare=true;
  const ok=h(`<span class="tc done">${icon('check')}<span>${cf?'WordPress and Cloudflare connected':'WordPress connected'}</span></span>`);el.replaceWith(ok);res('connected')};
 $('[data-h]',el).onclick=()=>{el.remove();setStep(run,i,'skip','You publish');const hc=h(`<div class="pc"><h5>The drafts are ready for you</h5><p>I keep this plan open. If you connect WordPress later, I publish from here.</p><div class="row"><button class="btn secondary sm" type="button" data-t="Copied to clipboard">${icon('file')}Copy</button><button class="btn secondary sm" type="button" data-t="Export is simulated">${icon('download')}Export .md</button><button class="btn secondary sm" type="button" data-t="Assigning is simulated">Assign to a teammate</button></div></div>`);$$('[data-t]',hc).forEach(b=>b.onclick=()=>toast(b.dataset.t));a.appendChild(hc);res('handoff')};a.appendChild(el)})}
function finish(run,a,handoff){const p=run.plan,d=handoff?p.handoff:p.done;if(handoff)run.measure=null;else run.measure=p.measure?{...p.measure,state:'wait',start:S.day}:null;
 setStatus(run,'done');
 receipt(a,{ico:handoff?'file':'check',title:d.title,badge:handoff?'Waiting':'Done',badgeTone:handoff?'warn':'ok',sub:handoff?'Waiting for you, just now':'Done, just now',rows:d.rows,undo:handoff?null:()=>{run.measure=null;renderRuns();toast('Reverted. Nothing is live.')}});
 notify(run,run.plan.title+' is done');
 if(run.measure)say(a,'I measure this on the next runs and report back here and on the dashboard.')}

function alertForm(a,pre){pre=pre||{metric:'Visibility score',cond:'goes below',thr:'30%'};
 const opt=(v,cur)=>`<option ${v===cur?'selected':''}>${v}</option>`;
 const el=h(`<form class="pc frm"><h5>Alert rule</h5><div class="fr"><label for="arM">When</label><div class="fc"><select id="arM" class="sel">${['Visibility score','Puma visibility','Share of voice'].map(v=>opt(v,pre.metric)).join('')}</select></div></div><div class="fr"><label for="arC">Condition</label><div class="fc two"><select id="arC" class="sel">${['goes below','rises above'].map(v=>opt(v,pre.cond)).join('')}</select><input id="arV" aria-label="Value" value="${esc(pre.thr)}"></div></div><div class="fr"><label for="arN">Notify me</label><div class="fc"><select id="arN" class="sel"><option>In the dashboard, as a signal</option><option>By email</option></select></div></div><div class="row"><button class="btn secondary sm" type="submit">Save alert</button><button class="lnk" type="button" data-x>Cancel</button></div><p class="note">Checked after every run. Next run Oct 16 02:00.</p></form>`);
 $('[data-x]',el).onclick=()=>el.remove();
 el.onsubmit=e=>{e.preventDefault();const m=$('#arM',el).value,c=$('#arC',el).value,v=$('#arV',el).value;el.remove();receipt(a,{ico:'bell',title:'Alert saved',rows:[['Metric',m],['Triggers when',`${c} ${v}`],['Next check','Oct 16 02:00']],undo:()=>{}})};a.appendChild(el)}
async function ga4Flow(){openPanel();let t=S.threads.find(x=>x.ctx&&x.ctx.type==='ga4');if(t){activate(t);return}
 t=newThread('Connect GA4',{label:'Revenue card',icon:'dash',type:'ga4'});activate(t);const a=turn(t,'Connect GA4');
 await tool(a,'Checking the revenue source','Checked the revenue source',800);await say(a,'The revenue numbers are a sample right now. Connect GA4 and I replace them with yours.');
 const el=h(`<div class="pc box"><h5>Google Analytics 4</h5><p>Read-only access to sessions and revenue. I never change anything in GA4.</p><div class="row"><button class="btn secondary sm" type="button">Connect GA4</button></div><small>The Google sign-in is simulated in this prototype.</small></div>`);

async function chartEdit(a,kind){const k=K.find(x=>x.id===S.chart.metric);if(!k.series){await say(a,`${k.name} has no daily series yet, so I can’t chart it by day.`);return}
 const prev=S.chart.kind,wasEd=S.chart.edited,label=kind==='bar'?'bars':'a line';
 if(prev===kind){await say(a,`${k.name} already shows ${label}.`);return chips(a,[[kind==='bar'?'Show it as a line':'Show it as bars'],['Alert me below 30%'],['Pin this chart']])}
 await tool(a,'Editing the chart','Edited the chart',500);S.chart.kind=kind;S.chart.edited=true;renderChart(true);
 await say(a,`${k.name} now shows ${kind==='bar'?'daily bars':'a line'} for Oct 9 to 15. The values are the same, only the view changed.`);
 undoLine(a,()=>{S.chart.kind=prev;S.chart.edited=wasEd;renderChart(true)});
 chips(a,[['Alert me below 30%'],['Why is it down?'],['Pin this chart']])}
async function why(a){await tool(a,'Reading 1,400 answers','Read 1,400 answers',1100);await say(a,'Perplexity is the only engine that fell: down 4.0 points to 36.0%. ChatGPT and Gemini are each up 2.0 to 40.0%, and Grok is flat at 34.0%. The weakest days were Oct 10 and Oct 11, both at 29.0%.');chips(a,[['Look into the Perplexity drop',()=>lookInto('note')]])}
async function route(t,text,a){const x=text.toLowerCase();
 {const wr=widgetRoute(t,text,a);if(wr)return wr}
 if(/\bbars?\b/.test(x))return chartEdit(a,'bar');
 if(/\bline\b/.test(x))return chartEdit(a,'line');
 if(/compare|previous|last (week|period)/.test(x)){S.chart.cmp=!S.chart.cmp;renderChart(true);return say(a,S.chart.cmp?'Added the previous 7 days to the chart.':'Removed the previous 7 days from the chart.')}
 if(/alert|notify/.test(x)){const m=x.match(/(\d+(?:\.\d+)?)\s*%?/);await say(a,'Check the rule and save it.');return alertForm(a,{metric:'Visibility score',cond:/above|over|rises?/.test(x)?'rises above':'goes below',thr:(m?m[1]:'30')+'%'})}
 if(/ga4|analytics|revenue/.test(x)){await say(a,'Opening the GA4 connection in its own thread.');return ga4Flow()}
 if(/remember|brain|priorit/.test(x))return brainFlow(a,text);
 if(/why|drop|down|fell/.test(x))return why(a);
 await say(a,'I can change this chart, set an alert, connect GA4 or look into a signal. Try one of these.');chips(a,[['Show it as bars'],['Set an alert'],['Look into the Perplexity drop',()=>lookInto('note')]])}
function send(text){text=(text||'').trim();if(!text)return;if(obChatInput(text))return;openPanel();const t=S.active;if(t.title==='New chat'){t.title=text.length>38?text.slice(0,37)+'…':text;$('#ptitleTx').textContent=t.title;if(S.full)crumbG();renderRecents()}const a=turn(t,text);route(t,text,a)}
function askChart(){const k=K.find(x=>x.id===S.chart.metric);openPanel();let t=S.threads.find(x=>x.ctx&&x.ctx.type==='chart'&&x.ctx.metric===k.id);if(t){activate(t);return}
 t=newThread(k.name,{label:k.name+' chart',icon:'bar',type:'chart',metric:k.id,name:k.name});activate(t);starter(t)}

 const step=(ts)=>{if(!on)return;if(!aside.offsetWidth){last=0;raf=requestAnimationFrame(step);return}if(!last)last=ts;const dt=Math.min(48,ts-last);last=ts;acc+=dt;
  if(acc>next){acc=0;next=2200+Math.random()*1600;if(pulses.length<3)spawn()}
  for(let k=pulses.length-1;k>=0;k--){const p=pulses[k];p.t+=p.speed*dt;const [pi,rev]=p.legs[p.leg];const L=len[pi];const d=rev?(1-p.t)*L:p.t*L;const pt=paths[pi].getPointAtLength(Math.max(0,Math.min(L,d)));p.el.setAttribute('cx',pt.x);p.el.setAttribute('cy',pt.y);
   if(p.t>=1){p.t=0;p.leg++;
    if(p.leg===1){flash('#scHFlash');flash('#scHalo')}
    else{if(p.dir==='in'){flash('#scBFlash')}else{flash($('#scM'+(p.m-1)).querySelector('.sc-flash'));bump(p.m-1)}p.el.remove();pulses.splice(k,1)}}}
  raf=requestAnimationFrame(step)};
 // parallax
 const tilt=$('#scTilt');
 const onMove=e=>{const r=aside.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;tilt.style.setProperty('--rx',(-y*2).toFixed(2)+'deg');tilt.style.setProperty('--ry',(x*3).toFixed(2)+'deg');tilt.style.setProperty('--px',(x*-4).toFixed(1)+'px');tilt.style.setProperty('--py',(y*-3).toFixed(1)+'px')};
 const onLeave=()=>{tilt.style.setProperty('--rx','0deg');tilt.style.setProperty('--ry','0deg');tilt.style.setProperty('--px','0px');tilt.style.setProperty('--py','0px')};
 const vis=()=>{if(document.hidden||reduce){on=false;cancelAnimationFrame(raf);live.textContent=reduce?'static':'paused'}else if(!on){on=true;last=0;live.textContent='live';raf=requestAnimationFrame(step)}};
 if(reduce){// static fallback: three frozen pulses and no parallax
  [[1,.55,'in'],[0,.4,'in'],[3,.7,'out']].forEach(([pi,f,dir])=>{const pt=paths[pi].getPointAtLength(len[pi]*f);const c=mk(dir);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y)});live.textContent='static';on=false}
 else{aside.addEventListener('pointermove',onMove);aside.addEventListener('pointerleave',onLeave);raf=requestAnimationFrame(step)}

 SCN={stop(){on=false;cancelAnimationFrame(raf);aside.removeEventListener('pointermove',onMove);aside.removeEventListener('pointerleave',onLeave);document.removeEventListener('visibilitychange',vis);SCN=null}}}

/* =============== CONNECT FLOW =============== */
function connectFlow(id,{reconnect}={}){
 const c=BY[id];let alive=true,pick=c.opts[0];
 const stp=n=>`<div class="stepper" role="img" aria-label="Step ${n} of 4">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
 const d=openDlg({title:(reconnect?'Reconnect ':'Connect ')+c.n,sub:'',body:'',foot:'',onClose:()=>{alive=false}});
 const cancel=`<button class="btn ghost md" data-x>Cancel</button>`;
 const s1=()=>d.set({title:(reconnect?'Reconnect ':'Connect ')+c.n,sub:reconnect?'Sign in again to renew access. Your settings stay as they are.':'Review what Henneth will be able to do. You can disconnect at any time.',
  body:`${stp(1)}<div>${c.read.map(x=>`<div class="perm"><span class="tile sm">${icon('eye')}</span><div class="tx"><b>Read</b><small>${esc(x)}</small></div></div>`).join('')}${c.write.map(x=>`<div class="perm"><span class="tile sm warn">${icon('sliders')}</span><div class="tx"><b>Write</b><small>${esc(x)}</small></div></div>`).join('')}${c.write.length?'':`<div class="perm"><span class="tile sm">${icon('lock')}</span><div class="tx"><b>Read-only</b><small>Henneth can’t change anything in ${esc(c.prov)}.</small></div></div>`}</div>`,
  foot:`${cancel}<button class="btn primary md" data-n="auth" data-autofocus>${icon('ext')}Continue to ${esc(c.prov)}</button>`});
 const auth=async()=>{
  d.set({title:'Waiting for '+c.prov,sub:'A sign-in window opened. Finish there, then come back.',body:`${stp(2)}<div class="steps2"><div class="s" data-s="run"><i></i>Waiting for ${esc(c.prov)}…</div></div>`,foot:`${cancel}<button class="btn secondary md" disabled>Reopen window</button>`,noFocus:true});
  await wait(1900);if(!alive)return;const r=S.csim;
  if(r==='ok'){reconnect?sync():choose()}else fail(r)};
 const fail=r=>{S.csim='ok';syncSeg();
  const m={denied:{h:'Access wasn’t granted',x:`You closed the window or chose “Don’t allow” in ${esc(c.prov)}. Henneth needs the permissions listed to work.`,a:'Try again',back:1},
   scope:{h:'A permission is missing',x:`${esc(c.prov)} connected, but without “${esc((c.write[0]||c.read[0]))}”. Allow every item in the list and try again.`,a:'Review permissions',back:1},
   down:{h:`${esc(c.prov)} isn’t responding`,x:`The sign-in service timed out. This is on ${esc(c.prov)}’s side, not yours. Nothing was changed.`,a:'Try again',back:0}}[r];
  d.set({title:'Couldn’t connect '+c.n,sub:'',body:`${stp(2)}<div class="banner bad" role="alert">${icon('alert')}<div><b>${m.h}</b><small>${m.x}</small></div></div><div class="ref" style="font:400 11px var(--font-mono);color:var(--fg-3)">${REF()}</div>`,foot:`${cancel}<button class="btn primary md" data-n="${m.back?'start':'auth'}" data-autofocus>${m.a}</button>`})};
 const choose=()=>d.set({title:'Choose what to connect',sub:`Henneth only reads the ${esc(c.n)} account you pick.`,
  body:`${stp(3)}<div class="fld"><div role="radiogroup" aria-label="Account" style="display:flex;flex-direction:column;gap:8px">${c.opts.map((o,i)=>`<label class="chk2"><input type="radio" name="acct" value="${esc(o)}" ${i?'':'checked'}><span class="tx"><b style="font-weight:500">${esc(o)}</b></span></label>`).join('')}</div></div>`,
  foot:`<button class="btn ghost md" data-n="start">Back</button><span class="grow"></span><button class="btn primary md" data-n="sync" data-autofocus>Connect</button>`});
 const sync=async()=>{const r=$('input[name=acct]:checked',d.el);if(r)pick=r.value;
  const steps=['Verifying access','Reading '+(reconnect?'your settings':'your account'),'Importing the last 90 days','Preparing your first view'];
  const paint=(k,pct)=>d.set({title:reconnect?'Renewing access':'Connecting '+c.n,sub:'',noFocus:true,body:`${stp(4)}<div class="steps2">${steps.map((t,i)=>`<div class="s" data-s="${i<k?'done':i===k?'run':'idle'}"><i>${i<k?icon('check'):''}</i><span>${t}</span></div>`).join('')}</div>${k===2?`<div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`:''}`,foot:`<span class="grow"></span><button class="btn ghost md" data-x>Run in background</button>`});
  paint(0);await wait(650);if(!alive)return;paint(1);await wait(650);if(!alive)return;
  for(const pc of [20,55,90]){paint(2,pc);await wait(520);if(!alive)return}
  paint(3);await wait(650);if(!alive)return;done()};
 const done=()=>{IX[id]=Object.assign({},IX[id]||{},{st:reconnect?'connected':'syncing',last:reconnect?'Just now':'Syncing',acct:pick,note:undefined,pct:reconnect?undefined:6});
  if(id==='ga4')S.ga4='syncing';if(id==='wordpress')S.int.wordpress=true;if(id==='cloudflare')S.int.cloudflare=true;rerender();if(!reconnect)syncNow(id,false,true);
  d.set({title:'',sub:'',body:`<div class="blk" style="align-items:flex-start;gap:16px"><span class="okmark okin"><svg class="i draw" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg></span><div><h3 class="a-t" style="font:var(--ty-title);margin:0">${esc(c.n)} is ${reconnect?'reconnected':'connected'}</h3><p style="margin:6px 0 0;color:var(--fg-2)">${reconnect?'Access is renewed. Paused work picks up where it stopped.':`First import takes about 4 minutes. Gandalf will tell you when ${id==='ga4'?'revenue data is':'it’s'} ready.`}</p></div></div>`,foot:`<button class="btn ghost md" data-n="view">View integration</button><button class="btn primary md" data-x data-autofocus>Done</button>`})};
 d.el.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;const n=b.dataset.n;
  if(n==='start')s1();else if(n==='auth')auth();else if(n==='sync')sync();else if(n==='view'){d.close();go('integrations',id)}});
 s1()}

function wireBrain(){const p=$('#page'),f=$('#bFind');
