<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found · Erdem Ülker</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light dark" />

<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  (()=>{
    const saved=localStorage.getItem('theme');
    const theme=saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    document.documentElement.dataset.theme=theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --s50:#fafaf9;--s100:#f5f5f4;--s200:#e7e5e4;--s300:#d6d3d1;
    --s400:#a8a29e;--s500:#78716c;--s600:#57534e;--s700:#44403c;
    --s800:#292524;--s900:#1c1917;
    --card-shadow:rgba(28,25,23,.07);
    --f:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --tk-lbl:.08em;--tk-1:-.011em;--tk-2:-.019em;--tk-3:-.027em;
    --ui:170ms;--soft:cubic-bezier(.22,1,.36,1);--out:cubic-bezier(.16,1,.24,1);
    --mx:24px;
  }
  :root[data-theme="dark"]{
    --s50:#1c1917;--s100:#292524;--s200:#44403c;--s300:#57534e;
    --s400:#78716c;--s500:#a8a29e;--s600:#d6d3d1;--s700:#e7e5e4;
    --s800:#f5f5f4;--s900:#fafaf9;
    --card-shadow:rgba(0,0,0,.24);
    color-scheme:dark;
  }
  @media(min-width:900px){:root{--mx:48px}}
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--f);font-size:17px;line-height:1.6;background:var(--s50);color:var(--s900);-webkit-font-smoothing:antialiased;
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;transition:background-color 520ms var(--soft),color 520ms var(--soft)}
  ::selection{background:var(--s200)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0}
  :focus-visible{outline:2px solid var(--s900);outline-offset:3px;border-radius:3px}
  .wrap{width:100%;max-width:1240px;margin-inline:auto;padding-inline:var(--mx)}
  .lbl{font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:var(--tk-lbl);color:var(--s500)}

  .nav{padding:22px 0}
  .nav .wrap{display:flex;justify-content:space-between;align-items:center;gap:18px}
  .bd{font-size:16px;font-weight:600;letter-spacing:var(--tk-1)}
  .bd-role{color:var(--s500);font-weight:400}
  .nr{display:flex;gap:28px;align-items:center;font-size:14.5px;color:var(--s500)}
  .nr a:not(.cta){position:relative;transition:color var(--ui) linear}
  .nr a:not(.cta):hover{color:var(--s900)}
  .nr a:not(.cta)::after{content:'';position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--s900);transition:width 420ms var(--soft)}
  .nr a:not(.cta):hover::after{width:100%}
  .cta{border:1px solid var(--s300);border-radius:99px;padding:7px 16px;font-size:14px;color:var(--s700);
    transition:background var(--ui) linear,color var(--ui) linear,border-color var(--ui) linear}
  .cta:hover,.cta:focus-visible{background:var(--s900);border-color:var(--s900);color:var(--s50)}
  .theme-toggle{position:relative;width:58px;height:32px;flex:none;border-radius:99px;background:var(--s900);cursor:pointer;color:var(--s50);
    transition:transform var(--ui) var(--soft),background-color 520ms var(--soft)}
  .theme-toggle:hover{transform:scale(1.04)}
  .theme-toggle:active{transform:scale(.96)}
  .theme-toggle .knob{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--s50);
    box-shadow:0 1px 4px var(--card-shadow);transition:transform 520ms var(--soft),background-color 520ms var(--soft)}
  [data-theme="dark"] .theme-toggle .knob{transform:translateX(26px)}
  .theme-toggle svg{position:absolute;top:7px;width:18px;height:18px;transition:opacity 320ms linear,transform 520ms var(--soft)}
  .theme-toggle .sun{right:7px;opacity:1}
  .theme-toggle .moon{left:7px;opacity:0;transform:rotate(-45deg)}
  [data-theme="dark"] .theme-toggle .sun{opacity:0;transform:rotate(45deg)}
  [data-theme="dark"] .theme-toggle .moon{opacity:1;transform:rotate(0)}
  @media(max-width:820px){.nr{gap:14px}.bd-role,.nr .hide-sm{display:none}}

  main{flex:1;display:flex;align-items:center;padding:48px 0 96px}
  .code{font-size:clamp(96px,18vw,220px);font-weight:300;line-height:.9;letter-spacing:-.05em;color:var(--s200);
    font-variant-numeric:tabular-nums;user-select:none}
  .code em{font-style:italic;color:var(--s300)}
  h1{margin-top:28px;font-size:clamp(30px,3.6vw,48px);font-weight:500;line-height:1.12;letter-spacing:var(--tk-3);max-width:20ch}
  h1 em{font-style:italic;font-weight:300;color:var(--s500)}
  .sub{margin-top:18px;font-size:clamp(16.5px,1.3vw,19px);font-weight:300;color:var(--s600);line-height:1.64;max-width:46ch}
  .acts{margin-top:40px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--s900);color:var(--s50);border-radius:99px;
    padding:13px 24px;font-size:15px;font-weight:500;letter-spacing:var(--tk-1);transition:transform var(--ui) var(--soft),background var(--ui) linear}
  .btn:hover{transform:translateY(-2px);background:var(--s800)}
  .btn svg{transition:transform 540ms var(--soft)}
  .btn:hover svg{transform:translateX(-4px)}
  .tl{font-size:15px;color:var(--s600);position:relative}
  .tl::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--s300);transform-origin:left;transition:background var(--ui) linear}
  .tl:hover{color:var(--s900)}.tl:hover::after{background:var(--s900)}

  .rv{opacity:0;transform:translateY(18px);animation:rv 900ms var(--out) forwards}
  .rv:nth-child(2){animation-delay:90ms}.rv:nth-child(3){animation-delay:170ms}.rv:nth-child(4){animation-delay:250ms}
  @keyframes rv{to{opacity:1;transform:none}}
  footer{padding:28px 0 36px;border-top:1px solid var(--s200);font-size:13.5px;color:var(--s500)}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  @media(prefers-reduced-motion:reduce){.rv{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a href="/" class="bd">Erdem Ülker <span class="bd-role">/ Product Designer</span></a>
    <div class="nr">
      <a href="/#work" class="hide-sm">Work</a>
      <a href="/about.html">About</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
        <span class="knob" aria-hidden="true"></span>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 15.4A9.4 9.4 0 1 1 8.6 3 7.5 7.5 0 0 0 21 15.4Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
      </button>
      <a href="mailto:hello@erdemulker.com" class="cta hide-sm">Get in touch</a>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="code rv" aria-hidden="true">4<em>0</em>4</div>
    <p class="lbl rv" style="margin-top:28px">Page not found</p>
    <h1 class="rv">This page took a <em>different route.</em></h1>
    <div class="rv">
      <p class="sub">The link may be old, or the page has moved. Everything I’m working on is a click away.</p>
      <div class="acts">
        <a href="/" class="btn">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M14 7.5H2M7 2.5l-5 5 5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to home
        </a>
        <a href="/#work" class="tl">See selected work</a>
      </div>
    </div>
  </div>
</main>

<footer><div class="wrap"><span>© Erdem Ülker</span><a href="mailto:hello@erdemulker.com" class="tl">hello@erdemulker.com</a></div></footer>

<script>
const t=document.getElementById('theme-toggle');
const sync=()=>{const d=document.documentElement.dataset.theme==='dark';const l=`Switch to ${d?'light':'dark'} mode`;t.setAttribute('aria-label',l);t.setAttribute('aria-pressed',String(d));t.title=l;};
sync();
t.addEventListener('click',()=>{
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  const apply=()=>{document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);sync();};
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.startViewTransition(apply);else apply();
});
</script>
</body>
</html>
