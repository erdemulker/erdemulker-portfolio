<title>Henneth Act Loop</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — 240px sidebar + main view (Gandalf thread, Dashboard grid). Arc UI tokens, dark-first. */
:root{
  --bg:#141414; --surface:#191919; --raised:#1f1f1f; --muted-surface:#242424;
  --fg:#f2f2f2; --fg-2:#b4b4b4; --fg-3:#8c8c8c;
  --border:#2b2b2b; --border-subtle:#222; --border-strong:#484848;
  --accent:#b6cfd9; --accent-strong:#c6e0e9; --on-accent:#141414;
  --success:#4cd676; --warning:#ffb90e; --danger:#ff736d;
  --s1:#55adff; --s2:#b464d8; --s3:#ff8a3d; --s4:#00c07a;
  --shadow-float:0 22px 55px rgba(0,0,0,.34),0 3px 10px rgba(0,0,0,.2);
  --shadow-rest:0 1px 2px rgba(0,0,0,.18);
  --tip-bg:#262626; --tip-fg:#f2f2f2; --tip-fg-2:#b4b4b4; --tip-border:#3a3a3a;
  --font-display:"Geist",Inter,system-ui,sans-serif;
  --font-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-control:18px; --r-panel:26px; --r-surface:34px;
  /* motion tokens (see motion-system.md) */
  --t-instant:80ms; --t-fast:150ms; --t-base:220ms; --t-slow:360ms; --t-hero:800ms;
  --e-standard:cubic-bezier(.2,0,0,1); --e-enter:cubic-bezier(0,0,.2,1); --e-exit:cubic-bezier(.4,0,1,1); --e-spring:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001);
  --stagger:40ms;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#ffffff; --surface:#ffffff; --raised:#ffffff; --muted-surface:#f8f8f8;
  --fg:#0b0b0b; --fg-2:#585858; --fg-3:#6e6e6e;
  --border:#e9e9e9; --border-subtle:#f3f3f3; --border-strong:#c4c4c4;
  --accent:#4a6974; --accent-strong:#375560; --on-accent:#ffffff;
  --success:#0a7a24; --warning:#a05500; --danger:#bf1c27;
  --s1:#1f7dcf; --s2:#7128a5; --s3:#d97a00; --s4:#009e84;
  --shadow-float:0 20px 48px rgba(0,0,0,.105),0 3px 10px rgba(0,0,0,.045);
  --shadow-rest:0 1px 2px rgba(0,0,0,.035);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#ffffff; --raised:#ffffff; --muted-surface:#f8f8f8;
  --fg:#0b0b0b; --fg-2:#585858; --fg-3:#6e6e6e;
  --border:#e9e9e9; --border-subtle:#f3f3f3; --border-strong:#c4c4c4;
  --accent:#4a6974; --accent-strong:#375560; --on-accent:#ffffff;
  --success:#0a7a24; --warning:#a05500; --danger:#bf1c27;
  --s1:#1f7dcf; --s2:#7128a5; --s3:#d97a00; --s4:#009e84;
  --shadow-float:0 20px 48px rgba(0,0,0,.105),0 3px 10px rgba(0,0,0,.045);
  --shadow-rest:0 1px 2px rgba(0,0,0,.035);
  color-scheme:light;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 14px/1.4 var(--font-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
/* micro: every pressable element answers hover and press */
.btn,.nav,.chip,.seg button,.iconbtn,.send,.recent,.searchbtn,.pal-item,.hover-acts button,.menu button,.info,.drow{transition:background-color var(--t-fast) var(--e-standard),color var(--t-fast) var(--e-standard),border-color var(--t-fast) var(--e-standard),box-shadow var(--t-fast) var(--e-standard),opacity var(--t-fast) var(--e-standard),transform var(--t-instant) var(--e-standard)}
.btn:active,.chip:active,.seg button:active,.iconbtn:active,.send:active:not([disabled]),.hover-acts button:active,.searchbtn:active{transform:scale(.97)}
.nav:active,.recent:active,.pal-item:active,.menu button:active{transform:scale(.985)}
.send:not([disabled]){transform:scale(1)}
.send[disabled]{transform:scale(.92)}
.btn.primary:active{opacity:.84}
/* state: pressed button briefly confirms */
.btn.done{background:var(--success);color:#fff;border-color:transparent}
.mono{font-family:var(--font-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.side{border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
.ws{display:flex;align-items:center;gap:10px;padding:8px 8px 10px}
.logo{width:28px;height:28px;border-radius:50%;background:var(--muted-surface);border:1px solid var(--border);display:grid;place-items:center;font-weight:600;font-size:12px}
.ws b{font-weight:500;flex:1}
.searchbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:14px;color:var(--fg-3);background:var(--surface);margin-bottom:10px;text-align:left}
.searchbtn .lbl2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font:500 11px var(--font-mono);border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--fg-2);background:var(--muted-surface)}
.nav{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:14px;color:var(--fg-2);text-align:left;width:100%;position:relative}
.nav:hover{background:var(--muted-surface);color:var(--fg)}
.nav[aria-current="page"]{background:var(--muted-surface);color:var(--fg);font-weight:500}
.nav .dot{animation:pop var(--t-slow) var(--e-spring)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.nav .dot{margin-left:auto;font:500 11px var(--font-mono);padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.grp{font:500 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:16px 12px 6px}
.recent{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent:hover{background:var(--muted-surface);color:var(--fg)}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:8px}
.me small{display:block;color:var(--fg-3);font-size:12px}
.me .tt{margin-left:auto}
.iconbtn{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;color:var(--fg-2)}
.iconbtn:hover{background:var(--muted-surface);color:var(--fg)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;border-bottom:1px solid var(--border);padding:0 var(--sbw,0px) 0 0}
.view{flex:1;overflow:auto;min-height:0}
.view>*{animation:view-in var(--t-slow) var(--e-enter) both}
@keyframes view-in{from{opacity:0;transform:translateY(6px)}}
.view.leaving>*{animation:view-out var(--t-fast) var(--e-exit) both}
@keyframes view-out{to{opacity:0;transform:translateY(-4px)}}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-control);font-weight:500;white-space:nowrap;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.secondary{background:var(--surface);border-color:var(--border);color:var(--fg)}
.btn.secondary:hover{background:var(--muted-surface);box-shadow:var(--shadow-rest)}
.btn.ghost{color:var(--fg-2)}
.btn.ghost:hover{background:var(--muted-surface);color:var(--fg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:default}


/* ===== v0.5: Monitor page + floating Gandalf panel. Reuses Arc tokens above. ===== */
[hidden]{display:none!important}
.tag{--c:var(--fg-2);position:relative;display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-mono);padding:2px 8px;border-radius:99px;color:var(--c);isolation:isolate;white-space:nowrap}
.tag::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);opacity:.10;z-index:-1}
.tag.ok{--c:var(--success)}.tag.warn{--c:var(--warning)}.tag.bad{--c:var(--danger)}
.tag.dot::after{content:"";order:-1;width:6px;height:6px;border-radius:50%;background:var(--c)}

/* rail: sidebar collapses while the panel pushes the page */
:is(body.rail:not(.sbopen),body.collapsed) .app{grid-template-columns:64px minmax(0,1fr)}
:is(body.rail:not(.sbopen),body.collapsed) .side{padding:12px 11px;align-items:center;overflow:visible}
:is(body.rail:not(.sbopen),body.collapsed) :is(.ws b,.lbl,.lbl2,.kbd,.grp,#recents,.me>div){display:none}
:is(body.rail:not(.sbopen),body.collapsed) :is(.nav,.searchbtn){width:40px;height:40px;padding:0;justify-content:center;gap:0}
:is(body.rail:not(.sbopen),body.collapsed) .ws{padding:4px 0 10px;flex-direction:column;gap:8px}
:is(body.rail:not(.sbopen),body.collapsed) .me{padding:8px 0}
.nav .ic{position:relative;display:grid}
.sdot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);display:none}
.sdot[data-s]{display:block}
.sdot[data-s=run]{background:var(--s1);animation:pulse 1.4s var(--e-standard) infinite}
.sdot[data-s=needs]{background:var(--warning)}
.sdot[data-s=failed]{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.main{transition:padding-right var(--t-base) var(--e-standard)}
body.pn .main{padding-right:424px}
body.pn.overlay .main{padding-right:0}
@media (max-width:1100px){body.pn .main{padding-right:0}}

/* page */
.page{max-width:1120px;margin:0 auto;padding:28px 40px 140px;display:flex;flex-direction:column;gap:28px}
.ph1{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0}
#runs:empty{display:none}
.ph1 h1{flex:1 1 280px;min-width:0;font:600 30px/1.15 var(--font-display);letter-spacing:-.02em;margin:0}
.psub{margin:-20px 0 0;color:var(--fg-2);max-width:68ch}
.ph-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border:1px solid var(--border);border-radius:99px;background:var(--surface)}
.seg button{height:28px;padding:0 14px;border-radius:99px;color:var(--fg-2);font-weight:500}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--muted-surface);color:var(--fg)}
.gh{display:flex;align-items:center;gap:12px;font:500 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.gh::after{content:"";flex:1;height:1px;background:var(--border);order:1}
.gh .mono{order:2;text-transform:none;letter-spacing:0;font-size:12px}
/* section titles: 28 page gap + 12 = 40 above (space-10), two steps up the Arc scale from 24 */
.page>.gh{margin-top:12px}
.card{border:1px solid var(--border);border-radius:var(--r-panel);background:var(--surface)}

/* in-progress strip */
.runs{display:flex;flex-direction:column;gap:8px}
.runrow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);animation:view-in var(--t-slow) var(--e-enter) both}
.runrow .tx{flex:1;min-width:0}
.runrow b{font-weight:500}
.runrow small{display:block;color:var(--fg-2);font-size:12.5px}
.rdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--s1)}
.rdot[data-s=run]{animation:pulse 1.4s infinite}.rdot[data-s=needs]{background:var(--warning)}.rdot[data-s=failed]{background:var(--danger)}.rdot[data-s=done]{background:var(--success)}
.rdot[data-s=meas]{background:transparent;box-shadow:inset 0 0 0 2px var(--s1)}
.rgrp+.rgrp{margin-top:14px}
.rgh{display:flex;align-items:center;gap:8px;margin:0 0 6px;font:500 12px var(--font-body);color:var(--fg-2)}
.rgh .mono{color:var(--fg-3)}
.rmore{margin-top:6px}
.mprog{height:4px;border-radius:2px;background:var(--border);margin-top:8px;overflow:hidden;max-width:320px}
.mprog i{display:block;height:100%;background:var(--accent);transform-origin:left center;transition:transform var(--t-slow) var(--e-standard)}
.runrow .nx{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--fg-2);white-space:nowrap}
.runrow .nx b{font-weight:500;color:var(--fg);font-size:12.5px}

/* signals: one CTA each */
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.sig{padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color var(--t-fast),opacity var(--t-base)}
.sig.on{border-color:var(--border-strong)}
.sig.gone{opacity:.45}
.sig h3{margin:0;font:500 15px/1.3 var(--font-body)}
.sig p{margin:0;color:var(--fg-2);font-size:13px;line-height:1.45}
.sig .btn{align-self:flex-start;margin-top:auto}
.sig .top1{display:flex;align-items:center;gap:8px}

/* KPI + chart */
.kcard{overflow:hidden}
.khead{padding:18px 20px 14px}
.khead h3{margin:0;font:500 15px var(--font-body)}
.khead p{margin:4px 0 0;color:var(--fg-2);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));border-top:1px solid var(--border);overflow-x:auto}
.tab{position:relative;text-align:left;padding:16px 20px 14px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px;color:var(--fg-2);min-width:0}
.tab:last-child{border-right:0}
.tab:hover{background:var(--muted-surface)}
.tab[aria-selected=true]{background:var(--muted-surface);color:var(--fg)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tab:focus-visible{outline-offset:-3px}
.tab .l{font-size:13px}
.tab .v{font:600 28px/1.1 var(--font-display);letter-spacing:-.02em;color:var(--fg)}
.tab .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--fg-2)}
.tab svg.viz{width:100%;height:44px;margin-top:4px;overflow:visible}
.chart{position:relative;padding:20px;border-top:1px solid var(--border);transition:background-color var(--t-slow) var(--e-standard)}
.chart.edited{background:color-mix(in srgb,var(--s1) 5%,var(--surface))}
.chead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chead h4{margin:0;font:500 15px var(--font-body);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chead p{margin:4px 0 0;color:var(--fg-2);font-size:13px}
.chead .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.lg{display:flex;align-items:center;gap:6px;color:var(--fg-2);font-size:12px;margin-right:6px}
.lg i{width:14px;height:0;border-top:2px solid var(--s1);display:inline-block}
.lg i.p{border-top:2px dashed var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--surface);color:var(--fg);font-weight:500;white-space:nowrap}
.chip:hover{background:var(--muted-surface);border-color:var(--border-strong)}
.chip[aria-pressed=true]{background:var(--muted-surface);border-color:var(--border-strong)}
.edpill{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-mono);padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--s1) 14%,var(--surface));color:var(--fg);animation:pop var(--t-slow) var(--e-spring)}
.edpill svg{color:var(--s1);width:12px;height:12px}
.plot{margin-top:14px;position:relative}
.plot svg{width:100%;height:auto;display:block;overflow:visible}
.plot .ax text{fill:var(--fg-3);font:11px var(--font-body)}
.plot .ax .g{stroke:var(--border)}.plot .ax .b{stroke:var(--border-strong)}
.plot .val{fill:var(--fg-2);font:11px var(--font-mono)}
.plot .hit{fill:transparent}
.tip{position:absolute;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);border:1px solid var(--tip-border);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:4;transform:translate(-50%,-100%);margin-top:-10px}
.tip em{font-style:normal;color:var(--tip-fg-2)}
.empty{padding:36px 8px;text-align:center;color:var(--fg-2)}
.empty b{display:block;color:var(--fg);font-weight:500;margin-bottom:4px}
.undo-note{color:var(--fg-3)}

/* revenue */
.rev{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.rev .hd{display:flex;align-items:center;gap:10px}
.rev .hd h3{margin:0;font:500 15px var(--font-body)}
.rev .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rev .m small{display:block;color:var(--fg-2);font-size:12.5px}
.rev .m b{font:600 24px var(--font-display);letter-spacing:-.02em}
.rev .m b.sk{display:inline-block;width:90px;height:24px;border-radius:8px;background:var(--muted-surface);animation:pulse 1.4s infinite}
.rev .ft{display:flex;align-items:center;gap:12px;color:var(--fg-2)}
.rev .ft .btn{margin-left:auto}

/* launcher and prototype controls */
.launch{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));height:44px;padding:0 16px 0 14px;border-radius:99px;border:1px solid var(--border);background:var(--raised);box-shadow:var(--shadow-float);display:flex;align-items:center;gap:10px;z-index:20;font-weight:500}
.launch:hover{border-color:var(--border-strong)}
.launch .ic{position:relative;display:grid}
body.pn .launch{display:none}
.top{position:relative;z-index:25}
.proto{position:relative;font-size:12.5px;flex:none}
.proto>.iconbtn{width:36px;height:36px;border:1px dashed var(--edge-control);color:var(--fg-2)}
.proto>.iconbtn:hover,.proto>.iconbtn[aria-expanded=true]{color:var(--fg);border-style:solid}
.pp{position:absolute;top:44px;right:0;width:290px;border:1px solid var(--border);border-radius:var(--r-control);background:var(--raised);box-shadow:var(--shadow-float);padding:12px;display:flex;flex-direction:column;gap:12px}
.pp .row{display:flex;flex-direction:column;gap:6px}
.pp .row>span{color:var(--fg-3);font:500 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.pp .seg{align-self:flex-start;flex-wrap:wrap}
.pp .seg button{padding:0 10px;height:26px;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-fg);border:1px solid var(--tip-border);border-radius:99px;padding:10px 16px;z-index:60;box-shadow:var(--shadow-float);animation:view-in var(--t-base) var(--e-enter) both}
.toast.closing{animation:view-out var(--t-fast) var(--e-exit) both}

/* ===== floating panel ===== */
.panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100% - 24px);background:var(--raised);border:1px solid var(--border);border-radius:var(--r-panel);box-shadow:var(--shadow-float);display:flex;flex-direction:column;overflow:hidden;z-index:30;transform:translateX(28px);opacity:0;visibility:hidden;transition:transform var(--t-slow) var(--e-enter),opacity var(--t-base) var(--e-standard),visibility 0s linear var(--t-slow)}
body.pn .panel{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.pph{display:flex;align-items:center;gap:2px;padding:8px 8px 8px 12px;position:relative;z-index:2}
.pph .ttl{display:flex;align-items:center;gap:6px;flex:1;min-width:0;height:36px;padding:0 8px;border-radius:12px;font-weight:500;text-align:left}
.pph .ttl:hover{background:var(--muted-surface)}
.pph .ttl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pph .ttl svg{color:var(--fg-3);width:14px;height:14px}
.pph .iconbtn{width:36px;height:36px}
.menu{position:absolute;top:50px;left:8px;min-width:260px;background:var(--raised);border:1px solid var(--border);border-radius:var(--r-control);box-shadow:var(--shadow-float);padding:4px;z-index:5;animation:view-in var(--t-base) var(--e-enter) both}

/* ===== v06 foundations: page template, form, dialog, empty state, motion base ===== */
:root{
  /* layout tokens: every non-chat page uses these */
  --w-page:1120px; --w-narrow:760px; --gutter:40px; --sec-gap:40px; --sub-nav:200px;
  /* type tokens (family Geist; weights 400/500/600) */
  --ty-display:600 30px/1.15 var(--font-display);  /* page title */
  --ty-title:600 20px/1.25 var(--font-display);    /* dialog, auth, empty state */
  --ty-head:600 15px/1.3 var(--font-display);      /* card and section heading */
  --ty-body:400 14px/1.45 var(--font-body);
  --ty-small:400 13px/1.45 var(--font-body);
  --ty-cap:500 11px/1.2 var(--font-body);          /* uppercase section label */
  /* colour roles added with Frost */
  --primary-tint:color-mix(in srgb,var(--accent) 12%,transparent);
  --danger-tint:color-mix(in srgb,var(--danger) 10%,transparent);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--accent-strong);
  /* motion recipes (see motion-system.md §v06) */
  --mo-rise:8px;
}
@media (max-width:760px){:root{--gutter:16px;--sec-gap:32px}}

/* ---- motion base: every recipe answers one state sentence ---- */
@keyframes mo-in{from{opacity:0;transform:translateY(var(--mo-rise))}}                       /* something arrived */
@keyframes mo-pop{from{opacity:0;transform:scale(.98) translateY(4px)}}                        /* a layer opened */
@keyframes mo-shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}} /* input rejected */
@keyframes mo-shimmer{to{background-position:-200% 0}}                                         /* loading */
@keyframes mo-draw{to{stroke-dashoffset:0}}                                                    /* success confirmed */
@keyframes mo-pulse{50%{opacity:.45}}                                                          /* syncing */
.mo-in{animation:mo-in var(--t-base) var(--e-enter) both}
.mo-stagger>*{animation:mo-in var(--t-slow) var(--e-enter) both;animation-delay:calc(var(--i,0)*var(--stagger))}
.mo-shake{animation:mo-shake 240ms var(--e-standard)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--muted-surface) 25%,color-mix(in srgb,var(--fg) 8%,var(--muted-surface)) 50%,var(--muted-surface) 75%);background-size:200% 100%;animation:mo-shimmer 1.4s linear infinite;min-height:12px}
.draw{stroke-dasharray:24;stroke-dashoffset:24;animation:mo-draw var(--t-slow) var(--e-enter) 120ms forwards}
@media (prefers-reduced-motion:reduce){.mo-shake,.sk,.draw{animation:none}.draw{stroke-dashoffset:0}}

/* switch */
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:var(--border-strong);border:0;flex:none;cursor:pointer;transition:background-color var(--t-fast) var(--e-standard)}

.sw[disabled]{opacity:.5;cursor:default}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-tint);color:var(--accent);display:grid;place-items:center;font:600 12px var(--font-body);flex:none}

/* ---- page template: header, width tiers, sections ---- */

/* ===== shell header v2 =====
   One top bar for every page: breadcrumb on the left, the page's action group on the right,
   aligned to the same column as the content below. The page title block (h1 + description)
   is plain content and scrolls away; nothing sticky overlays it. */
.top-in{height:100%;max-width:var(--w-page);margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:var(--sg,12px)}
.crumbs{display:flex;align-items:center;gap:4px;flex:1 1 auto;min-width:0;font:var(--ty-body);color:var(--fg-3);white-space:nowrap}

@media (max-width:760px){
 .crumbs .c-ws,.crumbs .c-ws+svg{display:none}
 /* detail pages: the title is right below, so the bar shows a back link instead of the full trail */

/* ===== primary action: tonal gradient + edge + highlight (comment on Invite people) =====
   Samples read live on Oct 15: Linear "Sign up" = solid #e5e5e6, 1px same-colour edge, pill, stacked 5-layer soft shadow, no gradient.
   Resend "Get started" = 104deg translucent white gradient (5% to 10%), 2px translucent border, 16 radius, small shadow.
   Both get depth from edge + shadow stack, not from colour change. Henneth: a ~10% tonal gradient (same hue), 1px darker edge,
   1px inner top highlight, soft shadow stack. Text contrast is checked at both gradient ends (dark 9.5+, light 4.7+). */
:root{--pri-top:#d4e8f0;--pri-bot:#a8c3ce;--pri-edge:#86a3af;--pri-hi:rgba(255,255,255,.62);--pri-sh:0 1px 1px rgba(0,0,0,.3),0 3px 8px -2px rgba(0,0,0,.35);--pri-over:rgba(255,255,255,.34);--pri-press:rgba(0,0,0,.28)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--pri-top:#547987;--pri-bot:#3f6370;--pri-edge:#2d4a55;--pri-hi:rgba(255,255,255,.28);--pri-sh:0 1px 1px rgba(23,48,58,.3),0 3px 6px -1px rgba(23,48,58,.22);--pri-over:rgba(0,0,0,.14);--pri-press:rgba(0,0,0,.32)}}
:root[data-theme=light]{--pri-top:#547987;--pri-bot:#3f6370;--pri-edge:#2d4a55;--pri-hi:rgba(255,255,255,.28);--pri-sh:0 1px 1px rgba(23,48,58,.3),0 3px 6px -1px rgba(23,48,58,.22);--pri-over:rgba(0,0,0,.14);--pri-press:rgba(0,0,0,.32)}
.btn.primary,.send{background:linear-gradient(180deg,var(--pri-top),var(--pri-bot));border-color:var(--pri-edge);color:var(--on-accent);box-shadow:inset 0 1px 0 var(--pri-hi),var(--pri-sh);position:relative;isolation:isolate}
.send{border:1px solid var(--pri-edge)}
.btn.primary::after,.send::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--pri-over);opacity:0;z-index:-1;pointer-events:none;transition:opacity var(--t-fast) var(--e-standard)}
.btn.primary:hover,.send:hover:not([disabled]){background:linear-gradient(180deg,var(--pri-top),var(--pri-bot))}
.btn.primary:hover::after,.send:hover:not([disabled])::after{opacity:1}
.btn.primary:active,.send:active:not([disabled]){opacity:1;box-shadow:inset 0 1px 3px var(--pri-press)}
.btn.primary[disabled],.send[disabled]{box-shadow:none;filter:saturate(.6)}
.btn.primary.done{background:var(--success)}
/* settings rows: the "Saved" flash sits left of the control, so every control ends at the same right edge */
.srow .ctl{position:relative}
.srow .saved{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);white-space:nowrap}
@media (max-width:640px){.srow .saved{position:static;transform:none}}
.subnav .grp:first-child{padding-top:4px}
/* brain: empty block aligns with the card padding instead of insetting twice */
.bblock .empty2.inline{padding:16px;border:1px dashed var(--border-strong);border-radius:var(--r-control)}

/* sidebar: recent chats (the history that used to sit in the Gandalf top bar) */
.recents{display:flex;flex-direction:column;gap:2px;max-height:268px;overflow:auto;margin:-4px;padding:4px}
.recents:empty{display:none}
.recent[aria-current=true]{background:var(--muted-surface);color:var(--fg)}

/* composer: slash actions popover */
.comp{position:relative}
.comp .hint{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 0;margin-left:-2px;border-radius:8px;color:var(--fg-3);font-size:12px}
.comp .hint:hover,.comp .hint[aria-expanded=true]{color:var(--fg)}
.slash{position:absolute;left:-1px;right:-1px;bottom:calc(100% + 8px);background:var(--raised);border:1px solid var(--border);border-radius:var(--r-panel);box-shadow:var(--shadow-float);padding:6px;z-index:8;max-height:min(420px,60vh);overflow:auto;animation:mo-in var(--t-base) var(--e-enter) both}
.slash .sh{padding:6px 10px 4px;font:500 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.slash [role=option]{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;color:var(--fg)}
.slash [role=option] .tile{width:32px;height:32px;border-radius:10px;flex:none}

/* dashboard: signals become one compact summary that points to Gandalf */
.sigs.sum{display:block}

.sigsum .tile{width:40px;height:40px;border-radius:12px;flex:none}
.sigsum .sx{flex:1;min-width:0}
.sigsum .sx b{font-weight:500}
.sigsum ul{display:flex;flex-wrap:wrap;gap:2px 20px;margin:4px 0 0;padding:0;list-style:none;color:var(--fg-2);font:var(--ty-small)}
.sigsum li{display:inline-flex;align-items:center;gap:8px;min-width:0}
.sdt{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg-3)}

@media (max-width:760px){.sigsum{flex-wrap:wrap}.sigsum .btn{width:100%;justify-content:center}}

/* ---- Grey-state illustrations (Figma: Illustrations · Grey states, set "illus", prop scene) ---- */
:root{--il-dark:block;--il-light:none}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--il-dark:none;--il-light:block}}
:root[data-theme=light]{--il-dark:none;--il-light:block}
.illus{position:relative;width:234px;height:196px;flex:none;pointer-events:none;user-select:none}
.illus img{position:absolute;inset:0;width:100%;height:100%;display:block}
.illus .il-d{display:var(--il-dark)}.illus .il-l{display:var(--il-light)}
.empty2:has(> .illus){padding-top:20px;gap:8px}
.empty2 > .illus{margin:0 0 -6px}

@media (prefers-reduced-motion:no-preference){.empty2 > .illus{animation:il-in var(--t-slow) var(--e-enter) both}}
@keyframes il-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- Sign-in side visual (hero scene; decorative motion allowed here, static fallback) ---- */
.a-r{overflow:hidden}
.a-r .pitch{max-width:560px;gap:28px}
.scene{position:relative;perspective:1200px;--rx:0deg;--ry:0deg;--px:0px;--py:0px}
.sc-tilt{position:relative;aspect-ratio:560/380;border:1px solid var(--border);border-radius:var(--r-panel);background:var(--bg);overflow:hidden;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform var(--t-hero) var(--e-standard);will-change:transform}
.sc-dots{position:absolute;inset:0;width:100%;height:100%;transform:translate(var(--px),var(--py));transition:transform var(--t-hero) var(--e-standard)}
.sc-dot{fill:var(--border-strong)}
.sc-dotfield{opacity:.55}
@media (prefers-reduced-motion:no-preference){.sc-dotfield{animation:sc-drift 120s linear infinite}}
@keyframes sc-drift{from{transform:translate(0,0)}to{transform:translate(24px,24px)}}
.sc-svg{position:absolute;inset:0;width:100%;height:100%}
.sc-edges path{fill:none;stroke:var(--border-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.sc-ring{fill:var(--surface);stroke:var(--border-strong);stroke-width:1}
.sc-ring.sc-acc{stroke:var(--accent);stroke-width:1.5}
.sc-halo{fill:none;stroke:var(--accent);stroke-width:1;opacity:0;transform-origin:center;transform-box:fill-box}
.sc-halo.on{animation:sc-halo 1600ms var(--e-exit) both}
@keyframes sc-halo{0%{opacity:.28;transform:scale(.82)}100%{opacity:0;transform:scale(1.08)}}
.sc-flash{fill:var(--accent);opacity:0;pointer-events:none}
.sc-flash.on{animation:sc-flash 900ms var(--e-exit) both}
@keyframes sc-flash{0%{opacity:.12}100%{opacity:0}}
.sc-chip{fill:var(--surface);stroke:var(--border-strong);stroke-width:1}
.sc-mono{font:500 12px var(--font-mono);fill:var(--fg-2)}
.sc-big{font-size:17px;font-weight:600;fill:var(--fg)}
.sc-acc-t{fill:var(--accent)}
.sc-lab{font:500 12px var(--font-body);fill:var(--fg-2)}
.sc-name{fill:var(--fg)}
.sc-count{fill:var(--fg-3);font-size:11px}
.sc-count.tick{animation:sc-tick var(--t-slow) var(--e-standard) both}
@keyframes sc-tick{0%{fill:var(--accent);transform:translateY(-2px)}100%{fill:var(--fg-3);transform:none}}
.sc-p{fill:var(--fg-2)}
.sc-p.in{fill:var(--accent);filter:drop-shadow(0 0 4px var(--accent))}
.sc-legend{display:flex;gap:20px;align-items:center;margin-top:12px;color:var(--fg-3);font:var(--ty-small)}
.sc-legend span{display:inline-flex;align-items:center;gap:8px}
.sc-k{width:8px;height:8px;border-radius:50%;background:var(--fg-2)}
.sc-k.acc{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.sc-live{margin-left:auto;font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.sc-tilt,.sc-dots{transition:none;transform:none}}

/* ---- Sync pipeline choreography: connector grows into the next node, node lights on arrival ---- */
.pipe .n::before{transform-origin:left center;transition:transform var(--t-slow) var(--e-standard),background-color var(--t-fast) var(--e-standard)}
.pipe .n[data-s=idle]::before{transform:scaleX(0)}
.pipe .n[data-s=run]::before{transition-delay:0s}
.pipe .d{transition:background-color var(--t-fast) var(--e-standard),border-color var(--t-fast) var(--e-standard),color var(--t-fast) var(--e-standard),transform var(--t-base) var(--e-spring)}
.pipe .n[data-s=run] .d{transition-delay:var(--t-slow)}
.pipe .d.lit{animation:pipe-pop var(--t-base) var(--e-spring) both}
@keyframes pipe-pop{0%{transform:scale(.9)}100%{transform:none}}
.pipe .n small{transition:color var(--t-fast)}

  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const en=btns.filter(b=>!b.disabled);let i=en.indexOf(document.activeElement);i=(i+(e.key==='ArrowDown'?1:-1)+en.length)%en.length;en[i].focus()}

/* =============== CONNECT FLOW =============== */
function connectFlow(id,{reconnect}={}){
 const c=BY[id];let alive=true,pick=c.opts[0];
 const stp=n=>`<div class="stepper" role="img" aria-label="Step ${n} of 4">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
 const d=openDlg({title:(reconnect?'Reconnect ':'Connect ')+c.n,sub:'',body:'',foot:'',onClose:()=>{alive=false}});
 const cancel=`<button class="btn ghost md" data-x>Cancel</button>`;
 const s1=()=>d.set({title:(reconnect?'Reconnect ':'Connect ')+c.n,sub:reconnect?'Sign in again to renew access. Your settings stay as they are.':'Review what Henneth will be able to do. You can disconnect at any time.',
  body:`${stp(1)}<div>${c.read.map(x=>`<div class="perm"><span class="tile sm">${icon('eye')}</span><div class="tx"><b>Read</b><small>${esc(x)}</small></div></div>`).join('')}${c.write.map(x=>`<div class="perm"><span class="tile sm warn">${icon('sliders')}</span><div class="tx"><b>Write</b><small>${esc(x)}</small></div></div>`).join('')}${c.write.length?'':`<div class="perm"><span class="tile sm">${icon('lock')}</span><div class="tx"><b>Read-only</b><small>Henneth can’t change anything in ${esc(c.prov)}.</small></div></div>`}</div>`,
  foot:`${cancel}<button class="btn primary md" data-n="auth" data-autofocus>${icon('ext')}Continue to ${esc(c.prov)}</button>`});
 const auth=async()=>{
  d.set({title:'Waiting for '+c.prov,sub:'A sign-in window opened. Finish there, then come back.',body:`${stp(2)}<div class="steps2"><div class="s" data-s="run"><i></i>Waiting for ${esc(c.prov)}…</div></div>`,foot:`${cancel}<button class="btn secondary md" disabled>Reopen window</button>`,noFocus:true});
  await wait(1900);if(!alive)return;const r=S.csim;
  if(r==='ok'){reconnect?sync():choose()}else fail(r)};
 const fail=r=>{S.csim='ok';syncSeg();
  const m={denied:{h:'Access wasn’t granted',x:`You closed the window or chose “Don’t allow” in ${esc(c.prov)}. Henneth needs the permissions listed to work.`,a:'Try again',back:1},
   scope:{h:'A permission is missing',x:`${esc(c.prov)} connected, but without “${esc((c.write[0]||c.read[0]))}”. Allow every item in the list and try again.`,a:'Review permissions',back:1},
   down:{h:`${esc(c.prov)} isn’t responding`,x:`The sign-in service timed out. This is on ${esc(c.prov)}’s side, not yours. Nothing was changed.`,a:'Try again',back:0}}[r];
  d.set({title:'Couldn’t connect '+c.n,sub:'',body:`${stp(2)}<div class="banner bad" role="alert">${icon('alert')}<div><b>${m.h}</b><small>${m.x}</small></div></div><div class="ref" style="font:400 11px var(--font-mono);color:var(--fg-3)">${REF()}</div>`,foot:`${cancel}<button class="btn primary md" data-n="${m.back?'start':'auth'}" data-autofocus>${m.a}</button>`})};
 const choose=()=>d.set({title:'Choose what to connect',sub:`Henneth only reads the ${esc(c.n)} account you pick.`,
  body:`${stp(3)}<div class="fld"><div role="radiogroup" aria-label="Account" style="display:flex;flex-direction:column;gap:8px">${c.opts.map((o,i)=>`<label class="chk2"><input type="radio" name="acct" value="${esc(o)}" ${i?'':'checked'}><span class="tx"><b style="font-weight:500">${esc(o)}</b></span></label>`).join('')}</div></div>`,
  foot:`<button class="btn ghost md" data-n="start">Back</button><span class="grow"></span><button class="btn primary md" data-n="sync" data-autofocus>Connect</button>`});
 const sync=async()=>{const r=$('input[name=acct]:checked',d.el);if(r)pick=r.value;
  const steps=['Verifying access','Reading '+(reconnect?'your settings':'your account'),'Importing the last 90 days','Preparing your first view'];
  const paint=(k,pct)=>d.set({title:reconnect?'Renewing access':'Connecting '+c.n,sub:'',noFocus:true,body:`${stp(4)}<div class="steps2">${steps.map((t,i)=>`<div class="s" data-s="${i<k?'done':i===k?'run':'idle'}"><i>${i<k?icon('check'):''}</i><span>${t}</span></div>`).join('')}</div>${k===2?`<div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`:''}`,foot:`<span class="grow"></span><button class="btn ghost md" data-x>Run in background</button>`});
  paint(0);await wait(650);if(!alive)return;paint(1);await wait(650);if(!alive)return;
  for(const pc of [20,55,90]){paint(2,pc);await wait(520);if(!alive)return}
  paint(3);await wait(650);if(!alive)return;done()};
 const done=()=>{IX[id]=Object.assign({},IX[id]||{},{st:reconnect?'connected':'syncing',last:reconnect?'Just now':'Syncing',acct:pick,note:undefined,pct:reconnect?undefined:6});
  if(id==='ga4')S.ga4='syncing';if(id==='wordpress')S.int.wordpress=true;if(id==='cloudflare')S.int.cloudflare=true;rerender();if(!reconnect)syncNow(id,false,true);
  d.set({title:'',sub:'',body:`<div class="blk" style="align-items:flex-start;gap:16px"><span class="okmark okin"><svg class="i draw" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg></span><div><h3 class="a-t" style="font:var(--ty-title);margin:0">${esc(c.n)} is ${reconnect?'reconnected':'connected'}</h3><p style="margin:6px 0 0;color:var(--fg-2)">${reconnect?'Access is renewed. Paused work picks up where it stopped.':`First import takes about 4 minutes. Gandalf will tell you when ${id==='ga4'?'revenue data is':'it’s'} ready.`}</p></div></div>`,foot:`<button class="btn ghost md" data-n="view">View integration</button><button class="btn primary md" data-x data-autofocus>Done</button>`})};
 d.el.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;const n=b.dataset.n;
  if(n==='start')s1();else if(n==='auth')auth();else if(n==='sync')sync();else if(n==='view'){d.close();go('integrations',id)}});
 s1()}

 {k:'voice',type:'single',q:()=>'How should Nike sound when I draft content?',opts:['Direct and energetic','Warm and friendly','Expert and precise'],other:'Something else…',ph:'Describe the voice',apply:(o,v)=>{o.voice=v}},
 {k:'prompts',type:'list',q:()=>'I drafted 12 questions buyers ask AI assistants, from nike.com and your category. I’ll ask each one on ChatGPT, Perplexity, Gemini, Claude and Copilot. Keep the ones that matter; 10 is a good start.',min:5,other:'Add your own question',apply:(o,v)=>{o.promptList=v;const first=!o.prompts;o.prompts=v.length;if(first)o.t0=S.day}},
 {k:'ga4',type:'single',q:()=>'Last one. Can I connect Google Analytics? Then I can tie AI answers to visits and revenue. Read-only.',opts:['Connect Google Analytics','Later'],apply:(o,v)=>{o.ga4Pick=v}}];
function obTalk(){const o=S.ob;o.mode='talk';
 if(o.chat&&!o.chat.done){S.active=o.chat.t;guard(()=>{if(S.view!=='gandalf')go('gandalf');else activate(o.chat.t)});return}
 if(S.view!=='gandalf'){go('gandalf')}
 let t=S.active;if(!t||$('.turn',t.el)){t=newThread('Set up Nike',null);addHome(t)}
 t.title='Set up Nike';S.active=t;activate(t);if(S.full)crumbG();renderRecents();
 const c=o.chat={t,i:0,done:false,wait:null};c.a=turn(t,'Set up by talking');
 (async()=>{await say(c.a,`Great. ${OB_Q.length} questions, one at a time. Tap an answer, or type your own below.`);obAsk()})()}
async function obAsk(){const o=S.ob,c=o.chat,st=OB_Q[c.i];const a=c.a;
 const prog=h(`<span class="obq-n mono">${c.i+1} of ${OB_Q.length}</span>`);a.appendChild(prog);
 await say(a,st.q(o));
 const box=h(`<div class="obq" role="group" aria-label="${esc(st.q(o))}"></div>`);a.appendChild(box);c.wait=st;
 if(st.type==='single'){
  box.innerHTML=`<div class="obq-o">${st.opts.map(x=>`<button type="button" class="chip" data-v="${esc(x)}">${esc(x)}</button>`).join('')}${st.other?`<button type="button" class="chip ghost" data-other>${esc(st.other)}</button>`:''}</div>`;
  box.onclick=e=>{const b=e.target.closest('[data-v]');if(b){obAnswer(b.dataset.v,b.dataset.v);return}if(e.target.closest('[data-other]'))obOther(box,st)}}
 else{const pre=st.type==='list'?OB_PROMPTS.map((p,i)=>({v:p[1],g:p[0],on:i<10})):st.opts.map(x=>({v:x,on:st.def.includes(x)}));c.sel=pre;
  const draw=()=>{const n=c.sel.filter(x=>x.on).length;
   box.innerHTML=(st.type==='list'?`<div class="obq-l">${c.sel.map((x,i)=>`<label class="obp-r"><input type="checkbox" data-i="${i}" ${x.on?'checked':''}><span>${esc(x.v)}</span>${x.g?`<small>${esc(x.g)}</small>`:''}</label>`).join('')}</div>`:`<div class="obq-o obchips">${c.sel.map((x,i)=>`<button type="button" class="chip" aria-pressed="${x.on}" data-i="${i}">${esc(x.v)}</button>`).join('')}</div>`)
   +(st.other?`<div class="obq-in"><div class="in"><input placeholder="${esc(st.other)}" aria-label="${esc(st.other)}"></div><button type="button" class="btn secondary md" data-add>Add</button></div>`:'')
   +`<div class="obq-f"><button type="button" class="btn primary md" data-go ${n<st.min?'disabled':''}>${n===0&&st.none?esc(st.none):'Continue'}</button><span class="ob-cnt" aria-live="polite">${n} selected${n<st.min?` · pick at least ${st.min}`:''}</span></div>`};
  draw();c.redraw=draw;
  const add=()=>{const i=$('.obq-in input',box);const v=i&&i.value.trim();if(!v)return;obAdd(v);setTimeout(()=>{const n=$('.obq-in input',box);n&&n.focus()},0)};
  box.onclick=e=>{const b=e.target.closest('button[data-i]');if(b){const x=c.sel[+b.dataset.i];x.on=!x.on;draw();$(`button[data-i="${b.dataset.i}"]`,box).focus();return}
   if(e.target.closest('[data-add]')){add();return}
   if(e.target.closest('[data-go]')){const v=c.sel.filter(x=>x.on).map(x=>x.v);obAnswer(v,v.length?(st.type==='list'?`${v.length} questions`:v.join(', ')):(st.none||'None'))}};
  box.onchange=e=>{const i=e.target.closest('input[data-i]');if(i){c.sel[+i.dataset.i].on=i.checked;const y=$('.obq-l',box).scrollTop;draw();$('.obq-l',box).scrollTop=y;$(`input[data-i="${i.dataset.i}"]`,box).focus()}};
  box.onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('.obq-in input')){e.preventDefault();add()}}}
 const f=$('button:not([disabled]),input',box);f&&f.focus({preventScroll:true});obRefresh()}
function obAdd(v){const c=S.ob.chat;if(!c.sel.some(x=>x.v.toLowerCase()===v.toLowerCase()))c.sel.push({v,on:true});else c.sel.find(x=>x.v.toLowerCase()===v.toLowerCase()).on=true;c.redraw()}
function obOther(box,st){box.innerHTML=`<div class="obq-in"><div class="in"><input placeholder="${esc(st.ph||'Your answer')}" aria-label="${esc(st.ph||'Your answer')}"></div><button type="button" class="btn primary md" data-send>Send</button><button type="button" class="btn ghost md" data-back>Back</button></div>`;
 const i=$('input',box);i.focus();const go2=()=>{const v=i.value.trim();if(v)obAnswer(v,v)};
 box.onclick=e=>{if(e.target.closest('[data-send]'))go2();else if(e.target.closest('[data-back]')){box.remove();S.ob.chat.a.querySelector('.obq-n')?.remove();S.ob.chat.a.lastElementChild?.remove();obAsk()}};
 i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go2()}}}
async function obAnswer(v,label){const o=S.ob,c=o.chat,st=OB_Q[c.i];c.wait=null;$('.obq',c.a)?.remove();st.apply(o,v);c.i++;c.a=turn(c.t,label);
 if(st.k==='ga4'&&v==='Connect Google Analytics'){await tool(c.a,'Waiting for Google sign-in','Signed in to Google',1100);await tool(c.a,'Reading GA4 properties','Picked Nike Global · G-4F2K9',900);IX.ga4={st:'syncing',last:'Syncing',acct:'Nike Global · G-4F2K9',pct:12}}
 else if(st.k==='comps'){await say(c.a,`Got it. ${v.length} competitor${v.length>1?'s':''}.`)}
 obRefresh();if(c.i<OB_Q.length)obAsk();else obWrap()}
async function obWrap(){const o=S.ob,c=o.chat,a=c.a;c.done=true;
 await tool(a,'Writing Brain','Wrote Company, Brand voice and Goals',800);
 const B=k=>BR.blocks.find(b=>b.k===k);
 const co=B('company');co.txt=`${o.brandName||'Nike'}${o.aka&&o.aka!=='—'?` (also known as ${o.aka})`:''}. Markets: ${(o.markets||[]).join(', ')}. Compared with ${(o.comps||[]).join(', ')}.`;
 const vo=B('voice');vo.txt=o.voice||'';const go_=B('goals');go_.txt=o.goal||'';[co,vo,go_].forEach(b=>{if(b.txt){b.when='just now';b.by='You, with Gandalf'}});
 await tool(a,'Starting the first baseline',`Tracking ${o.prompts} questions on 5 assistants`,900);
 await say(a,'That’s everything. Here’s what I set up:');
 receipt(a,{ico:'check',title:'Nike is set up',sub:'First numbers in 24 to 48 hours',badge:'Done',rows:[['Competitors',(o.comps||[]).join(', ')],['Prompts',`${o.prompts} on 5 assistants`],['Analytics',IX.ga4?'Google Analytics':'Not yet'],['Brain','Company, voice, goals']],
  buttons:[{label:'Review Brain',icon:'brain',fn:()=>guard(()=>go('brain'))},{label:'Open dashboard',icon:'dash',fn:()=>guard(()=>go('dashboard'))}]});
 await say(a,`I’ll post here when the first numbers land. Anything you want to change, just tell me, or edit it in Brain.${IX.ga4?'':' You can connect Google Analytics from Integrations any time.'}`);
 chips(a,[['Invite my team',()=>guard(()=>go('settings','members'))]]);
 obRefresh()}
obChatInput=function(text){const o=S.ob,c=o&&o.chat;if(!c||!c.wait||c.done||S.active!==c.t)return false;const st=c.wait;
 if(st.type==='single'){obAnswer(text,text);return true}
 obAdd(text);toast(`Added “${text}”.`);return true};

/* Sidebar Setup chip follows whichever path is active: the conversation (question n of 8, then the baseline) or the checklist (n of 5). */
function obChipState(n){const o=S.ob,c=o.chat;
 if(o.mode==='manual')return {l:'Setup',v:`${n}/5`,p:n/5,lab:`Setup, ${n} of 5 done`};
 if(c&&!c.done)return {l:'Setup',v:`${c.i}/${OB_Q.length}`,p:c.i/OB_Q.length,lab:`Continue setup, question ${Math.min(c.i+1,OB_Q.length)} of ${OB_Q.length}`};
 if(c&&c.done)return {l:obBaseF()?'Setup':'First baseline',v:obBaseF()?'Done':'24–48 h',p:obBaseF()?1:.9,wait:!obBaseF(),lab:obBaseF()?'Setup done':'First baseline running'};
 return {l:'Set up Nike',v:`0/${OB_Q.length}`,p:0,lab:'Start setup with Gandalf'}}
function obChipSync(n){const ch=$('#obChip');if(!ch)return;const o=S.ob;const st=obChipState(n);
 const done=o.mode==='manual'?n===5:(o.chat&&o.chat.done&&obBaseF());ch.hidden=!!done;
 $('[data-l]',ch).textContent=st.l;$('[data-n]',ch).textContent=st.v;$('i i',ch).style.transform=`scaleX(${st.p})`;ch.classList.toggle('wait',!!st.wait);ch.setAttribute('aria-label',st.lab)}
function obChipGo(){const o=S.ob;o.dismissed=false;
 if(o.mode==='manual'){guard(()=>{if(S.view!=='gandalf')go('gandalf');else obRefresh()});return}
 if(o.chat&&o.chat.done){const t=o.chat.t;guard(()=>{S.active=t;if(S.view!=='gandalf')go('gandalf');else{activate(t);renderRecents()}});return}
 obTalk()}

go('gandalf');
})();

})();
</script>
